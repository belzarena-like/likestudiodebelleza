<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #ff214f;
            --secondary: #d4002c;
            --dark: #343a40;
            --light: #f8f9fa;
            --accent: #ff5477;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: var(--light);
            padding: 1rem;
            overflow-x: hidden;
        }

        .tabs-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tab {
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 163, 115, 0.2);
            transition: all 0.3s ease;
            color: var(--light);
            font-size: 0.9rem;
        }

        .tab:hover {
            background: rgba(212, 163, 115, 0.2);
            border-color: var(--primary);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(255, 33, 79, 0.4);
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            padding: 0.5rem;
        }

        .card-flip {
            perspective: 1000px;
            height: 420px;
            position: relative;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .card-flip:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 163, 115, 0.2);
            border-radius: 20px;
            overflow: hidden;
        }

        .card-front {
            transform: rotateY(0deg);
        }

        .card-back {
            transform: rotateY(180deg);
            padding: 1.5rem;
            justify-content: flex-start;
            overflow-y: auto;
        }

        .card-img-top {
            width: 100%;
            height: 180px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .card-body {
            padding: 1.5rem;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-body h4 {
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .card-body p {
            color: #c4c4c4;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .card-body .badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            display: inline-block;
            margin-top: 0.5rem;
            border: none;
        }

        .card-back h4 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .card-back p {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #c4c4c4;
        }

        /* Mobile optimizations */
        @media (max-width: 768px) {
            body {
                padding: 0.5rem;
            }

            .tabs-container {
                gap: 0.5rem;
                margin-bottom: 1.5rem;
            }

            .tab {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }

            .services-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding: 0.25rem;
            }

            .card-flip {
                height: 380px;
            }

            .card-img-top {
                height: 160px;
            }

            .card-body {
                padding: 1rem;
            }

            .card-body h4 {
                font-size: 1.1rem;
            }

            .card-back {
                padding: 1rem;
            }

            .card-back h4 {
                font-size: 1.1rem;
            }

            .card-back p {
                font-size: 0.8rem;
                line-height: 1.5;
            }

            /* Enable tap to flip on mobile */
            .card-flip.flipped .card-inner {
                transform: rotateY(180deg);
            }
        }

        @media (max-width: 480px) {
            .card-flip {
                height: 360px;
            }

            .card-img-top {
                height: 140px;
            }

            .card-body h4,
            .card-back h4 {
                font-size: 1rem;
            }

            .tab {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }
        }

        /* Smooth scrollbar for card back */
        .card-back::-webkit-scrollbar {
            width: 6px;
        }

        .card-back::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .card-back::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        .card-back::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }
    </style>
</head>

        if (targetTab) {
            document.querySelector('.tab.active').classList.remove('active');
            document.querySelector('.tab-pane.active').classList.remove('active');

            targetTab.classList.add('active');

        document.addEventListener('click', (event) => {
            const card = event.target.closest('.card-flip');
            if (card) {
                card.classList.toggle('flipped');
