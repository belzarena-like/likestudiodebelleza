        :root {

        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: var(--light);
            padding: 1rem;
            overflow-x: hidden;
        }

        .tabs-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tab {
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 163, 115, 0.2);
            transition: all 0.3s ease;
            color: var(--light);
            font-size: 0.9rem;
        }

        .tab:hover {
            background: rgba(212, 163, 115, 0.2);
            border-color: var(--primary);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(212, 163, 115, 0.4);
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card-flip {
            perspective: 1000px;
            min-height: 420px;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 420px;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }
        .card-flip:hover .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 163, 115, 0.2);
            border-radius: 20px;
            overflow: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
            padding: 1.5rem;
            justify-content: center;
            overflow-y: auto;
        }

        .card-img-top {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 1.5rem;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-body h4 {
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .card-body .badge {
             background: linear-gradient(135deg, var(--primary), var(--secondary));
             color: var(--dark);
             font-size: 1rem;
             font-weight: 600;
             padding: 0.5rem 1rem;

        }

        .card-back h4 {
            color: var(--primary);

        }

        .card-back p {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #c4c4c4;
        }
    </style>
</head>

    const categories = {};
    offerings.forEach(service => {
        const categoryName = service.info.category;
        if (!categories[categoryName]) {
            categories[categoryName] = [];
        }
        categories[categoryName].push(service);
    });

    const tabsContainer = document.getElementById('tabsContainer');
    const tabContentsContainer = document.getElementById('tabContents');

    Object.keys(categories).forEach((categoryName, index) => {
        const categoryId = categoryName.replace(/[^a-zA-Z0-9]/g, '');
        const tab = document.createElement('button');
        tab.classList.add('tab');
        if (index === 0) tab.classList.add('active');
        tab.textContent = categoryName;
        tab.dataset.category = categoryId;
        tabsContainer.appendChild(tab);

        const tabPane = document.createElement('div');
        tabPane.classList.add('tab-pane');
        if (index === 0) tabPane.classList.add('active');
        tabPane.id = `content-${categoryId}`;

        const grid = document.createElement('div');
        grid.classList.add('services-grid');

        categories[categoryName].forEach(service => {
            const cardWrapper = document.createElement('div');
            cardWrapper.classList.add('card-flip');

            const priceText = service.price ? `${service.price}€` : 'Consultar';

            cardWrapper.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <img src="${service.image || 'assets/imgs/about.jpeg'}" class="card-img-top" alt="${service.info.name}">
                        <div class="card-body">
                            <div>
                                <h4>${service.info.name}</h4>
                                <p>${service.duration || 'N/A'}</p>
                            </div>
                            <span class="badge">${priceText}</span>
                        </div>
                    </div>
                    <div class="card-back">
                        <h4>${service.info.name}</h4>
                        <p>${service.info.description}</p>
                    </div>
                </div>
            `;
            grid.appendChild(cardWrapper);
        });

        tabPane.appendChild(grid);
        tabContentsContainer.appendChild(tabPane);
    });

    tabsContainer.addEventListener('click', (event) => {
        const targetTab = event.target.closest('.tab');
        if (targetTab) {
            document.querySelector('.tab.active').classList.remove('active');
            document.querySelector('.tab-pane.active').classList.remove('active');

            targetTab.classList.add('active');
            document.getElementById(`content-${targetTab.dataset.category}`).classList.add('active');
        }
    });
</script>
