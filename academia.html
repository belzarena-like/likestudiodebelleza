<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academia Like Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="stylesheet" href="css/academia.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/imgs/logo.png" alt="Like Studio logo" />
      <span>Like Studio Academia</span>
    </a>
    <div id="user-info" style="display:none" class="user-info-bar">
      <span id="user-name-display"></span>
      <span id="expiry-display" class="expiry-badge"></span>
      <button class="btn btn-sm btn-secondary" onclick="logout()">Salir</button>
    </div>
  </header>

  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/imgs/logo.png" alt="Like Studio" />
      </div>
      <h1>Academia Like Studio</h1>
      <p class="login-subtitle">Accede a tu formación</p>
      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Usuario</label>
          <input type="text" id="login-username" autocomplete="username" required placeholder="Tu usuario">
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" autocomplete="current-password" required placeholder="Tu contraseña">
        </div>
        <p id="login-error" class="login-error" style="display:none"></p>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Course Viewer -->
  <div id="course-screen" class="course-screen" style="display:none">
    <div class="course-layout">
      <!-- Sidebar: video list -->
      <aside class="video-sidebar">
        <div class="sidebar-header">
          <h2 id="course-title-sidebar"></h2>
          <p id="course-instructor-sidebar" class="text-muted text-sm"></p>
        </div>
        <ul id="video-list" class="video-list"></ul>
      </aside>

      <!-- Main: video player -->
      <main class="video-main">
        <div id="player-placeholder" class="player-placeholder">
          <p>Selecciona un video para comenzar</p>
        </div>
        <div id="player-container" class="player-container" style="display:none">
          <div id="video-iframe-container" class="video-iframe-container">
            <!-- Iframe will be created here -->
          </div>
          <div class="video-details">
            <h3 id="current-video-title"></h3>
            <p id="current-video-desc" class="text-muted"></p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; <span id="year"></span> LIKE STUDIO ACADEMY, SOCIEDAD LIMITADA | <a href="aviso-legal.html" class="text-link">Aviso Legal</a></p>
  </footer>

  <script src="static/js/app-config.js"></script>
  <script type="module" src="static/js/academia-controller.js"></script>
  <script src="static/js/site.js"></script>
</body>
</html>
