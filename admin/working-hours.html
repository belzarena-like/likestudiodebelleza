<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horario de trabajo | Like Studio Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <style>
    .admin-summary {
      color: #d9e1ee;
    }

    .admin-table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0f141d;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
      color: #e7edf8;
    }

    .admin-table thead tr {
      background: #222d3f;
      text-align: left;
    }

    .admin-table th,
    .admin-table td {
      padding: 10px;
      border-top: 1px solid #2a354a;
    }

    .admin-table input[type="time"],
    .admin-table select {
      width: 100%;
      min-width: 120px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #cfd6e6;
    }

    @media (max-width: 900px) {
      .admin-table {
        min-width: 560px;
        font-size: 0.9rem;
      }
      .admin-table th,
      .admin-table td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/imgs/logo.jpg" alt="Like Studio logo" />
      <span>Admin Like Studio</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>
      <a href="index.html">Consentimientos</a>
      <a href="clients.html">Clientes</a>
      <a href="client-profiles.html">Perfiles CRM</a>
      <a href="sessions.html">Sesiones</a>
      <a href="booking-draft.html">Booking / Agenda</a>
      <a href="services.html">Servicios</a>
      <a href="working-hours.html">Horario</a>
      <a href="../index.html">Web publica</a>
      <a href="#" onclick="likestudioAdminLogout(); return false;">Cerrar sesion</a>
    </nav>
  </header>

  <main class="form-wrap" style="width:min(960px,100% - 2rem)">
    <p class="eyebrow">Panel Admin</p>
    <h1>Horario de trabajo</h1>
    <p class="form-note">Define los dias y el rango de horas en el que se permiten reservas publicas.</p>

    <div class="form-actions" style="margin: 0 0 16px;">
      <button id="save-button" class="btn" type="button">Guardar horario</button>
      <button id="reload-button" class="btn btn-ghost" type="button">Recargar</button>
      <span id="status" class="status-pill"></span>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Dia</th>
            <th>Estado</th>
            <th>Hora inicio</th>
            <th>Hora fin</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <p id="message" class="form-note admin-summary" style="margin-top:12px"></p>
  </main>

  <script src="../static/js/admin-auth.js"></script>
  <script src="../static/js/app-config.js"></script>
  <script src="../static/js/site.js"></script>
  <script>
    const API_URL = `${window.APP_CONFIG.API_BASE_URL}/admin/working-hours`;
    const dayNames = [
      'Lunes',
      'Martes',
      'Miercoles',
      'Jueves',
      'Viernes',
      'Sabado',
      'Domingo'
    ];

    const tableBody = document.getElementById('table-body');
    const message = document.getElementById('message');
    const status = document.getElementById('status');
    const saveButton = document.getElementById('save-button');
    const reloadButton = document.getElementById('reload-button');

    function setStatus(text, isError) {
      status.textContent = text || '';
      status.style.color = isError ? '#ff8ca3' : '#cfd6e6';
    }

    function toTimeInput(value) {
      if (!value) return '';
      return String(value).slice(0, 5);
    }

    function renderRows(items) {
      const map = {};
      (items || []).forEach((item) => {
        map[item.weekday] = item;
      });

      tableBody.innerHTML = '';
      dayNames.forEach((label, weekday) => {
        const entry = map[weekday] || { weekday, is_open: false, start_time: null, end_time: null };
        const isOpen = Boolean(entry.is_open);
        const startValue = toTimeInput(entry.start_time);
        const endValue = toTimeInput(entry.end_time);
        const row = document.createElement('tr');
        row.dataset.weekday = String(weekday);
        row.innerHTML = `
          <td>${label}</td>
          <td>
            <select data-open-select>
              <option value="true">Abierto</option>
              <option value="false">Cerrado</option>
            </select>
          </td>
          <td>
            <input data-start-input type="time" step="900" value="${startValue}" />
          </td>
          <td>
            <input data-end-input type="time" step="900" value="${endValue}" />
          </td>
        `;
        const openSelect = row.querySelector('[data-open-select]');
        const startInput = row.querySelector('[data-start-input]');
        const endInput = row.querySelector('[data-end-input]');

        openSelect.value = isOpen ? 'true' : 'false';
        startInput.disabled = !isOpen;
        endInput.disabled = !isOpen;
        if (!isOpen) {
          startInput.value = '';
          endInput.value = '';
        }

        tableBody.appendChild(row);
      });
    }

    function loadWorkingHours() {
      message.textContent = 'Cargando...';
      setStatus('');
      return fetch(API_URL)
        .then((response) => {
          if (!response.ok) throw new Error('No se pudo cargar el horario.');
          return response.json();
        })
        .then((payload) => {
          renderRows(payload.items || []);
          message.textContent = '';
        })
        .catch((error) => {
          message.textContent = error.message;
          setStatus('Error', true);
        });
    }

    function parseMinutes(value) {
      if (!value) return null;
      const parts = value.split(':');
      if (parts.length < 2) return null;
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function collectItems() {
      const rows = Array.from(tableBody.querySelectorAll('tr'));
      const items = [];
      for (const row of rows) {
        const weekday = parseInt(row.dataset.weekday, 10);
        const isOpen = row.querySelector('[data-open-select]').value === 'true';
        const startValue = row.querySelector('[data-start-input]').value;
        const endValue = row.querySelector('[data-end-input]').value;

        if (isOpen) {
          const startMinutes = parseMinutes(startValue);
          const endMinutes = parseMinutes(endValue);
          if (startMinutes === null || endMinutes === null) {
            throw new Error('Completa las horas de inicio y fin para los dias abiertos.');
          }
          if (startMinutes >= endMinutes) {
            throw new Error('La hora de inicio debe ser menor que la hora fin.');
          }
        }

        items.push({
          weekday,
          is_open: isOpen,
          start_time: isOpen ? startValue : null,
          end_time: isOpen ? endValue : null
        });
      }
      return items;
    }

    function saveWorkingHours() {
      message.textContent = '';
      setStatus('Guardando...');
      let payload;
      try {
        payload = { items: collectItems() };
      } catch (error) {
        setStatus('');
        message.textContent = error.message;
        return;
      }

      saveButton.disabled = true;
      fetch(API_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then((response) => {
          if (!response.ok) {
            return response.json().then((data) => {
              throw new Error(data.detail || 'Error al guardar el horario.');
            });
          }
          return response.json();
        })
        .then((data) => {
          renderRows(data.items || []);
          message.textContent = 'Horario actualizado.';
          setStatus('Guardado');
        })
        .catch((error) => {
          message.textContent = error.message;
          setStatus('Error', true);
        })
        .finally(() => {
          saveButton.disabled = false;
        });
    }

    tableBody.addEventListener('change', (event) => {
      if (!event.target.matches('[data-open-select]')) return;
      const row = event.target.closest('tr');
      const isOpen = event.target.value === 'true';
      const startInput = row.querySelector('[data-start-input]');
      const endInput = row.querySelector('[data-end-input]');
      startInput.disabled = !isOpen;
      endInput.disabled = !isOpen;
      if (!isOpen) {
        startInput.value = '';
        endInput.value = '';
      }
    });

    saveButton.addEventListener('click', saveWorkingHours);
    reloadButton.addEventListener('click', loadWorkingHours);

    loadWorkingHours();
  </script>
</body>
</html>
