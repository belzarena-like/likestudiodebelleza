<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Consentimientos | Like Studio Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <style>
    .admin-summary {
      color: #d9e1ee;
    }

    .admin-table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0f141d;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      color: #e7edf8;
    }

    .admin-table thead tr {
      background: #222d3f;
      text-align: left;
    }

    .admin-table th,
    .admin-table td {
      padding: 10px;
      border-top: 1px solid #2a354a;
    }

    .admin-empty {
      color: #c8d2e3;
      padding: 12px;
    }

    .quick-create {
      margin: 0 0 16px;
    }

    .quick-create details {
      display: inline-block;
      min-width: 280px;
    }

    .quick-create summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    .quick-create summary::-webkit-details-marker {
      display: none;
    }

    .quick-create-panel {
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0f141d;
      padding: 8px;
      display: grid;
      gap: 8px;
    }

    .quick-create-panel a {
      text-decoration: none;
    }

    @media (max-width: 700px) {
      .admin-table {
        min-width: 680px;
        font-size: 0.88rem;
      }

      .admin-table th,
      .admin-table td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/imgs/logo.jpg" alt="Like Studio logo" />
      <span>Admin Like Studio</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>
      <a href="../index.html">Web publica</a>
      <a href="#" onclick="likestudioAdminLogout(); return false;">Cerrar sesion</a>
    </nav>
  </header>

  <main class="form-wrap" style="width:min(1200px,100% - 2rem)">
    <p class="eyebrow">Panel Admin</p>
    <h1>Consentimientos firmados</h1>

    <div class="quick-create">
      <details>
        <summary class="btn">Nuevo consentimiento</summary>
        <div class="quick-create-panel">
          <a class="btn btn-ghost" href="consent-micropigmentacion.html">Micropigmentacion</a>
          <a class="btn btn-ghost" href="consent-estetico.html">Ficha estetica corporal</a>
          <a class="btn btn-ghost" href="consent-laser.html">Depilacion laser</a>
          <a class="btn btn-ghost" href="consent-eliminacion-laser.html">Eliminacion tatuaje/micropigmentacion</a>
        </div>
      </details>
    </div>

    <form id="search-form" class="form-grid" style="margin-bottom:14px">
      <div>
        <label for="full_name">Nombre cliente</label>
        <input id="full_name" name="full_name" />
      </div>
      <div>
        <label for="id_number">DNI/NIE</label>
        <input id="id_number" name="id_number" />
      </div>
      <div>
        <label for="consent_type">Tipo</label>
        <select id="consent_type" name="consent_type">
          <option value="">Todos</option>
          <option value="micropigmentation">Micropigmentacion</option>
          <option value="aesthetic_treatment">Tratamiento estetico</option>
          <option value="laser">Depilacion laser</option>
        </select>
      </div>
      <div>
        <label for="signed_from">Desde</label>
        <input id="signed_from" name="signed_from" type="date" />
      </div>
      <div>
        <label for="signed_to">Hasta</label>
        <input id="signed_to" name="signed_to" type="date" />
      </div>
      <div style="display:flex;align-items:flex-end;gap:8px;">
        <button class="btn" type="submit">Buscar</button>
        <button class="btn btn-ghost" type="button" id="reset">Limpiar</button>
      </div>
    </form>

    <p id="summary" class="form-note admin-summary">Cargando...</p>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Fecha firma</th>
            <th>Cliente</th>
            <th>DNI/NIE</th>
            <th>Tipo</th>
            <th>Tratamiento/Area</th>
            <th>Profesional</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="form-actions" style="justify-content:space-between;">
      <button id="prev" class="btn btn-ghost" type="button">Anterior</button>
      <button id="next" class="btn btn-ghost" type="button">Siguiente</button>
    </div>
  </main>

  <script src="../static/js/admin-auth.js"></script>
  <script src="../static/js/app-config.js"></script>
  <script src="../static/js/site.js"></script>
  <script>
    const API_URL = `${window.APP_CONFIG.API_BASE_URL}/admin/consents`;
    const limit = 20;
    let offset = 0;
    let lastTotal = 0;

    const form = document.getElementById('search-form');
    const summary = document.getElementById('summary');
    const tableBody = document.getElementById('table-body');

    function collectParams() {
      const data = new FormData(form);
      const params = new URLSearchParams();
      ['full_name', 'id_number', 'consent_type', 'signed_from', 'signed_to'].forEach((key) => {
        const value = data.get(key);
        if (value) params.set(key, value);
      });
      params.set('limit', String(limit));
      params.set('offset', String(offset));
      return params;
    }

    function renderRows(items) {
      if (!items.length) {
        tableBody.innerHTML = '<tr><td class="admin-empty" colspan="7">Sin resultados.</td></tr>';
        return;
      }

      tableBody.innerHTML = items.map((item) => {
        const kindMap = {
          micropigmentation: 'Micropigmentacion',
          aesthetic_treatment: 'Tratamiento estetico',
          laser: 'Depilacion laser'
        };
        const kind = kindMap[item.consent_type] || item.consent_type;
        return `
          <tr>
            <td>${item.signed_at}</td>
            <td>${item.client_name}</td>
            <td>${item.client_id_number}</td>
            <td>${kind}</td>
            <td>${item.treatment_areas}</td>
            <td>${item.therapist_name}</td>
            <td><a class="btn btn-ghost" href="consent-view.html?id=${item.id}" target="_blank" rel="noopener">Abrir</a></td>
          </tr>
        `;
      }).join('');
    }

    async function loadConsents() {
      summary.textContent = 'Cargando...';
      try {
        const response = await fetch(`${API_URL}?${collectParams().toString()}`);
        if (!response.ok) throw new Error('No se pudieron obtener los consentimientos.');
        const payload = await response.json();
        lastTotal = payload.total;
        renderRows(payload.items);

        const from = payload.total === 0 ? 0 : payload.offset + 1;
        const to = Math.min(payload.offset + payload.limit, payload.total);
        summary.textContent = `Mostrando ${from}-${to} de ${payload.total} consentimientos.`;

        document.getElementById('prev').disabled = payload.offset <= 0;
        document.getElementById('next').disabled = payload.offset + payload.limit >= payload.total;
      } catch (error) {
        summary.textContent = error.message;
        tableBody.innerHTML = '';
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      offset = 0;
      loadConsents();
    });

    document.getElementById('reset').addEventListener('click', () => {
      form.reset();
      offset = 0;
      loadConsents();
    });

    document.getElementById('prev').addEventListener('click', () => {
      offset = Math.max(0, offset - limit);
      loadConsents();
    });

    document.getElementById('next').addEventListener('click', () => {
      if (offset + limit < lastTotal) {
        offset += limit;
        loadConsents();
      }
    });

    loadConsents();
  </script>
</body>
</html>
