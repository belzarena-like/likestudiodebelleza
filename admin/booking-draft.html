<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking | Like Studio Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <style>
    :root {
      --hour-height: 80px;
    }

    .booking-card {
      background: #0f141d;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    body.modal-open {
      overflow: hidden;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 18, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-card {
      width: min(720px, 100%);
      background: #0f141d;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      max-height: calc(100vh - 32px);
      overflow: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .btn-danger {
      border-color: rgba(255, 77, 109, 0.4);
      color: #ff8aa0;
    }

    .btn-danger:hover {
      background: rgba(255, 77, 109, 0.12);
    }

    .scheduler-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 6px 0 14px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .toolbar-actions {
      flex: 1 1 auto;
    }

    .toolbar-filters {
      flex: 1 1 520px;
      gap: 10px;
    }

    .toolbar-filters select {
      min-width: 220px;
      flex: 1 1 220px;
    }

    .toolbar-views {
      margin-left: auto;
    }

    .toolbar-range {
      font-weight: 700;
      color: #dbe4f5;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #171d28;
    }

    .range-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .calendar-picker {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.01;
      border: 0;
      padding: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      z-index: 2;
      appearance: none;
      -webkit-appearance: none;
    }

    .calendar-picker::-webkit-calendar-picker-indicator {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    #range-label {
      position: relative;
      z-index: 1;
    }

    .view-toggle {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-toggle .btn.is-active {
      background: linear-gradient(135deg, var(--brand), #be3535);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(190, 53, 53, 0.27);
    }

    .scheduler-grid {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #0f141d;
    }

    .time-column {
      background: #151a25;
      border-right: 1px solid #2a354a;
      display: flex;
      flex-direction: column;
    }

    .time-header {
      padding: 10px;
      font-weight: 700;
      color: #c4d0e4;
      border-bottom: 1px solid #2a354a;
      text-align: center;
    }

    .time-body {
      display: flex;
      flex-direction: column;
    }

    .time-label {
      height: var(--hour-height);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-size: 0.75rem;
      color: #91a0b8;
      padding-top: 6px;
      border-bottom: 1px solid rgba(42, 53, 74, 0.45);
    }

    .days-grid {
      display: grid;
      grid-auto-columns: minmax(160px, 1fr);
      grid-auto-flow: column;
    }

    .day-column {
      border-right: 1px solid #2a354a;
      position: relative;
      background: #121822;
      min-width: 160px;
    }

    .day-header {
      padding: 10px;
      font-weight: 700;
      color: #d9e1ee;
      border-bottom: 1px solid #2a354a;
      background: #1b2231;
      text-align: center;
    }

    .day-header.is-clickable {
      cursor: pointer;
    }

    .day-body {
      position: relative;
      height: calc(var(--hour-height) * var(--hour-count));
      background-image: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.05) 0,
        rgba(255, 255, 255, 0.05) 1px,
        transparent 1px,
        transparent var(--hour-height)
      );
    }

    .appointment-block {
      position: absolute;
      left: 6px;
      right: 6px;
      border-radius: 10px;
      padding: 10px 10px 8px;
      color: #f6f7fb;
      font-size: 0.8rem;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .appointment-block .block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 6px;
    }

    .appointment-block .block-resource {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #dbe4f5;
      background: rgba(15, 20, 29, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 999px;
    }

    .appointment-block .block-resource.is-empty {
      opacity: 0;
      border-color: transparent;
      background: transparent;
      padding: 0;
    }

    .appointment-block .block-title {
      font-weight: 700;
      margin-bottom: 2px;
    }

    .appointment-block .block-meta {
      font-size: 0.75rem;
      line-height: 1.25;
      opacity: 0.85;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .appointment-block .block-body {
      display: grid;
      gap: 2px;
      overflow: hidden;
      padding-right: 0;
    }

    .appointment-block .block-meta.notes {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .appointment-block.appointment {
      background: #325a84;
    }

    .appointment-block.block {
      background: #d5a153;
      color: #1f1300;
    }

    .appointment-block .block-actions {
      display: flex;
      gap: 1px;
      align-items: center;
    }

    .appointment-block .icon-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-weight: 700;
      font-size: 0.6rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }

    .appointment-block .icon-btn:hover {
      background: rgba(0, 0, 0, 0.45);
    }

    .appointment-block .icon-btn.danger {
      border-color: rgba(255, 77, 109, 0.45);
      color: #ffb1c0;
    }

    .current-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #ff4d6d;
      z-index: 4;
    }

    .current-dot {
      position: absolute;
      left: -4px;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4d6d;
    }

    .agenda-month {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
    }

    .month-cell {
      border: 1px solid #2a354a;
      border-radius: 10px;
      padding: 8px;
      background: #141922;
      min-height: 90px;
    }

    .month-cell.is-muted {
      opacity: 0.4;
    }

    .month-cell strong {
      display: block;
      font-size: 0.8rem;
    }

    .month-count {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #c9d3e6;
    }

    .agenda-empty {
      color: var(--muted);
    }

    .booking-message {
      margin: 8px 0 0;
      color: #d9e1ee;
    }

    @media (max-width: 900px) {
      .toolbar-row {
        flex-direction: column;
        align-items: stretch;
      }
      .toolbar-group {
        width: 100%;
      }
      .toolbar-filters {
        flex-direction: column;
      }
      .toolbar-views {
        margin-left: 0;
        justify-content: flex-start;
      }
    }

    @media (max-width: 1024px) {
      .scheduler-grid {
        grid-template-columns: 60px 1fr;
      }
      .days-grid {
        grid-auto-columns: minmax(150px, 1fr);
      }
    }

    @media (max-width: 720px) {
      .scheduler-grid {
        grid-template-columns: 1fr;
      }
      .time-column {
        display: none;
      }
      .days-grid {
        grid-auto-columns: minmax(220px, 1fr);
        overflow-x: auto;
      }
      .modal-card {
        padding: 14px;
      }
      .appointment-block {
        font-size: 0.74rem;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/imgs/logo.jpg" alt="Like Studio logo" />
      <span>Admin Like Studio</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>
      <a href="index.html">Volver</a>
      <a href="#" onclick="likestudioAdminLogout(); return false;">Cerrar sesion</a>
    </nav>
  </header>

  <main class="form-wrap" style="width:min(1200px,100% - 2rem)">
    <p class="eyebrow">Agenda</p>
    <h1>Booking / Agenda</h1>
    <div class="scheduler-toolbar">
      <div class="toolbar-row">
        <div class="toolbar-group toolbar-actions">
          <button id="new-booking" class="btn btn-sm" type="button">Nueva reserva</button>
          <button id="today-btn" class="btn btn-ghost btn-sm" type="button">Hoy</button>
          <button id="prev-btn" class="btn btn-ghost btn-sm" type="button">&#9664;</button>
          <button id="next-btn" class="btn btn-ghost btn-sm" type="button">&#9654;</button>
          <div class="range-picker">
            <button id="range-label" class="toolbar-range btn btn-ghost btn-sm" type="button"></button>
            <input id="calendar-picker" class="calendar-picker" type="date" aria-label="Seleccionar fecha" />
          </div>
        </div>
      </div>
      <div class="toolbar-row">
        <div class="toolbar-group toolbar-filters">
        <select id="resource-filter">
          <option value="">Todos los profesionales</option>
        </select>
        <select id="service-filter">
          <option value="">Todos los servicios</option>
        </select>
        </div>
        <div class="toolbar-group toolbar-views">
          <div class="view-toggle">
            <button class="btn btn-ghost btn-sm is-active" type="button" data-view="day">Dia</button>
            <button class="btn btn-ghost btn-sm" type="button" data-view="week">Semana</button>
            <button class="btn btn-ghost btn-sm" type="button" data-view="month">Mes</button>
          </div>
        </div>
      </div>
    </div>

    <section class="booking-card">
      <h3 id="agenda-title">Agenda</h3>
      <div id="agenda-container"></div>
    </section>
  </main>

  <div class="modal-overlay" id="booking-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="booking-modal-title">
      <div class="modal-header">
        <div>
          <p class="eyebrow">Reserva</p>
          <h2 id="booking-modal-title">Nueva reserva</h2>
        </div>
        <button id="booking-close" class="btn btn-ghost btn-sm" type="button">Cerrar</button>
      </div>
      <form id="booking-form" class="form-grid">
        <div>
          <label>Cliente</label>
          <select id="booking-client">
            <option value="">Seleccionar...</option>
          </select>
        </div>
        <div>
          <label>Telefono</label>
          <input id="booking-phone" placeholder="Se carga del cliente" readonly />
        </div>
        <div>
          <label>Tratamiento</label>
          <input id="booking-service" list="booking-services" placeholder="Seleccione servicio" />
          <datalist id="booking-services"></datalist>
        </div>
        <div>
          <label>Profesional</label>
          <select id="booking-professional" required>
            <option value="">Seleccionar...</option>
            <option>Josemi</option>
            <option>Liege</option>
          </select>
        </div>
        <div>
          <label>Fecha</label>
          <input type="date" id="booking-date" required />
        </div>
        <div>
          <label>Hora inicio</label>
          <input type="time" id="booking-start" value="11:00" required />
        </div>
        <div>
          <label>Hora fin</label>
          <input type="time" id="booking-end" value="12:00" required />
        </div>
        <div>
          <label>Tipo</label>
          <select id="booking-type">
            <option value="appointment">Appointment</option>
            <option value="block">Block</option>
          </select>
        </div>
        <div class="form-grid-1">
          <label>Notas</label>
          <textarea id="booking-notes" placeholder="Notas internas"></textarea>
        </div>
        <div class="form-actions form-grid-1" style="justify-content:space-between;align-items:center;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="booking-submit" class="btn" type="submit">Guardar reserva</button>
            <button id="booking-reset" class="btn btn-ghost" type="reset">Limpiar</button>
          </div>
          <button id="booking-delete" class="btn btn-ghost btn-danger" type="button" hidden>Eliminar</button>
        </div>
        <p id="booking-message" class="form-note booking-message form-grid-1"></p>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="client-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="client-modal-title">
      <div class="modal-header">
        <div>
          <p class="eyebrow">Cliente</p>
          <h2 id="client-modal-title">Nuevo cliente</h2>
        </div>
        <button id="client-close" class="btn btn-ghost btn-sm" type="button">Cerrar</button>
      </div>
      <form id="new-client-form" class="form-grid">
        <div>
          <label>Nombre completo</label>
          <input id="new-client-name" required />
        </div>
        <div>
          <label>DNI/NIE (opcional)</label>
          <input id="new-client-id-number" />
        </div>
        <div>
          <label>Telefono</label>
          <input id="new-client-phone" required />
        </div>
        <div>
          <label>Email</label>
          <input id="new-client-email" type="email" />
        </div>
        <div class="form-actions form-grid-1">
          <button class="btn" type="submit">Guardar cliente</button>
        </div>
        <p id="new-client-message" class="form-note form-grid-1"></p>
      </form>
    </div>
  </div>

  <script src="../static/js/admin-auth.js"></script>
  <script src="../static/js/app-config.js"></script>
  <script src="../static/js/site.js"></script>
  <script>
    const agendaContainer = document.getElementById('agenda-container');
    const agendaTitle = document.getElementById('agenda-title');
    const bookingForm = document.getElementById('booking-form');
    const bookingClient = document.getElementById('booking-client');
    const bookingPhone = document.getElementById('booking-phone');
    const bookingService = document.getElementById('booking-service');
    const bookingServicesList = document.getElementById('booking-services');
    const bookingProfessional = document.getElementById('booking-professional');
    const bookingDate = document.getElementById('booking-date');
    const bookingStart = document.getElementById('booking-start');
    const bookingEnd = document.getElementById('booking-end');
    const bookingType = document.getElementById('booking-type');
    const bookingNotes = document.getElementById('booking-notes');
    const bookingSubmit = document.getElementById('booking-submit');
    const bookingMessage = document.getElementById('booking-message');
    const bookingModal = document.getElementById('booking-modal');
    const bookingModalTitle = document.getElementById('booking-modal-title');
    const bookingClose = document.getElementById('booking-close');
    const bookingDelete = document.getElementById('booking-delete');
    const newBookingButton = document.getElementById('new-booking');
    const newClientModal = document.getElementById('client-modal');
    const newClientClose = document.getElementById('client-close');
    const newClientForm = document.getElementById('new-client-form');
    const newClientName = document.getElementById('new-client-name');
    const newClientIdNumber = document.getElementById('new-client-id-number');
    const newClientPhone = document.getElementById('new-client-phone');
    const newClientEmail = document.getElementById('new-client-email');
    const newClientMessage = document.getElementById('new-client-message');

    const viewButtons = document.querySelectorAll('[data-view]');
    const rangeLabel = document.getElementById('range-label');
    const todayBtn = document.getElementById('today-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const resourceFilter = document.getElementById('resource-filter');
    const serviceFilter = document.getElementById('service-filter');
    const calendarPicker = document.getElementById('calendar-picker');

    const API_BASE = window.APP_CONFIG.API_BASE_URL;
    const WORKING_HOURS_URL = `${API_BASE}/admin/working-hours`;

    const START_HOUR = 9;
    const END_HOUR = 21;
    const PIXELS_PER_MINUTE = 1.8;
    const HOURS_COUNT = END_HOUR - START_HOUR;

    let currentView = 'day';
    let selectedDate = new Date();
    let entries = [];
    let appointmentsById = {};
    let clientsById = {};
    let servicesByName = {};
    let editingId = null;
    let workingHoursByWeekday = {};
    let workingHoursLoaded = false;

    document.documentElement.style.setProperty('--hour-height', `${PIXELS_PER_MINUTE * 60}px`);
    document.documentElement.style.setProperty('--hour-count', HOURS_COUNT);

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function shortTagFromName(value) {
      const cleaned = String(value || '').trim().replace(/\s+/g, ' ');
      if (!cleaned) return '';
      const firstWord = cleaned.split(' ')[0] || cleaned;
      return firstWord.slice(0, 5).toUpperCase();
    }

    function parseDate(value) {
      if (!value) return null;
      if (String(value).includes('/')) {
        const parts = String(value).split('/');
        if (parts.length !== 3) return null;
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        const date = new Date(year, month, day);
        date.setHours(0, 0, 0, 0);
        return date;
      }
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return null;
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function sameDay(a, b) {
      return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function startOfWeek(date) {
      const base = new Date(date);
      const offset = (base.getDay() + 6) % 7;
      base.setDate(base.getDate() - offset);
      base.setHours(0, 0, 0, 0);
      return base;
    }

    function formatDayLabel(date) {
      const weekdays = ['Lun', 'Mar', 'Mie', 'Jue', 'Vie', 'Sab', 'Dom'];
      return `${weekdays[(date.getDay() + 6) % 7]} ${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}`;
    }

    function formatMonthLabel(date) {
      const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
      return `${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    function toIsoDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function weekdayIndex(date) {
      return (date.getDay() + 6) % 7;
    }

    function timeToMinutes(value) {
      if (!value) return null;
      const parts = String(value).split(':');
      if (parts.length < 2) return null;
      const hour = parseInt(parts[0], 10);
      const minute = parseInt(parts[1], 10);
      if (Number.isNaN(hour) || Number.isNaN(minute)) return null;
      return hour * 60 + minute;
    }

    function getWorkingHoursForDate(date) {
      if (!date) return null;
      return workingHoursByWeekday[weekdayIndex(date)] || null;
    }

    function validateWorkingHours(date, startTime, endTime) {
      const rule = getWorkingHoursForDate(date);
      if (!rule || !rule.is_open) {
        return 'El estudio esta cerrado en esa fecha.';
      }
      if (!rule.start_time || !rule.end_time) {
        return 'Horario no configurado para ese dia.';
      }
      const openStart = timeToMinutes(rule.start_time);
      const openEnd = timeToMinutes(rule.end_time);
      const startMinutes = timeToMinutes(startTime);
      const endMinutes = timeToMinutes(endTime);
      if (openStart === null || openEnd === null || startMinutes === null || endMinutes === null) {
        return 'Horario no valido.';
      }
      if (startMinutes < openStart || endMinutes > openEnd) {
        return 'La reserva esta fuera del horario de trabajo.';
      }
      return '';
    }

    function syncRangeLabel(date) {
      if (!date) return;
      if (currentView === 'week') {
        const start = startOfWeek(date);
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        rangeLabel.textContent = `${formatDayLabel(start)} - ${formatDayLabel(end)}`;
        return;
      }
      if (currentView === 'month') {
        rangeLabel.textContent = formatMonthLabel(date);
        return;
      }
      rangeLabel.textContent = formatDayLabel(date);
    }

    function applySelectedDate(date) {
      if (!date) return;
      selectedDate = date;
      calendarPicker.value = toIsoDate(date);
      syncRangeLabel(date);
      loadAgenda();
    }

    function normalizeAppointments(items) {
      return items.map((item) => ({
        id: item.id,
        date: parseDate(item.appointment_date),
        start: String(item.start_time || '').slice(0, 5),
        end: String(item.end_time || '').slice(0, 5),
        service: item.service_name,
        customer: item.client_name || '',
        notes: item.notes || '',
        type: item.appointment_type,
        professional: item.professional_name,
        status: item.status,
        raw: item
      })).filter((entry) => entry.date);
    }

    function minutesFromStart(timeText) {
      const parts = String(timeText || '').split(':');
      if (parts.length !== 2) return null;
      const hour = parseInt(parts[0], 10);
      const minute = parseInt(parts[1], 10);
      if (Number.isNaN(hour) || Number.isNaN(minute)) return null;
      return (hour - START_HOUR) * 60 + minute;
    }

    function filteredEntries() {
      const resource = resourceFilter.value;
      const service = serviceFilter.value;
      return entries.filter((entry) => {
        if (resource && entry.professional !== resource) return false;
        if (service && entry.service !== service) return false;
        return true;
      });
    }

    function buildTimeColumn() {
      const timeLabels = [];
      for (let h = 0; h < HOURS_COUNT; h += 1) {
        const hour = START_HOUR + h;
        timeLabels.push(`<div class="time-label">${String(hour).padStart(2, '0')}:00</div>`);
      }
      return `
        <div class="time-column">
          <div class="time-header">Hora</div>
          <div class="time-body">${timeLabels.join('')}</div>
        </div>
      `;
    }

    function buildDayColumn(day, dayEntries) {
      const blocks = dayEntries.map((entry) => {
        const startMinutes = minutesFromStart(entry.start);
        const endMinutes = minutesFromStart(entry.end);
        if (startMinutes === null || endMinutes === null) return '';
        const baseHeight = (endMinutes - startMinutes) * PIXELS_PER_MINUTE;
        const top = Math.max(0, startMinutes * PIXELS_PER_MINUTE + 3);
        const height = Math.max(96, baseHeight - 6);
        const title = escapeHtml(entry.service || 'Reserva');
        const customer = escapeHtml(entry.customer || '');
        const notes = escapeHtml(entry.notes || '');
        const professional = escapeHtml(entry.professional || '');
        const resourceTag = shortTagFromName(entry.professional);
        const resourceBadge = resourceTag
          ? `<div class="block-resource" title="${professional}">${resourceTag}</div>`
          : '<div class="block-resource is-empty"></div>';
        const blockType = entry.type === 'block' ? 'block' : 'appointment';
        return `
          <div class="appointment-block ${blockType}" style="top:${top}px;height:${height}px;" data-id="${entry.id}" data-start-min="${startMinutes}" data-end-min="${endMinutes}">
            <div class="block-header">
              ${resourceBadge}
              <div class="block-actions">
                <button class="icon-btn" type="button" data-edit-id="${entry.id}" title="Editar" aria-label="Editar">E</button>
                <button class="icon-btn" type="button" data-duplicate-id="${entry.id}" title="Duplicar" aria-label="Duplicar">D</button>
                <button class="icon-btn danger" type="button" data-delete-id="${entry.id}" title="Eliminar" aria-label="Eliminar">X</button>
              </div>
            </div>
            <div class="block-body">
              <div class="block-title">${title}</div>
              ${customer ? `<div class="block-meta">${customer}</div>` : ''}
              ${notes ? `<div class="block-meta notes" title="${notes}">${notes}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      const now = new Date();
      let currentLine = '';
      if (sameDay(day, now)) {
        const minutes = (now.getHours() - START_HOUR) * 60 + now.getMinutes();
        if (minutes >= 0 && minutes <= HOURS_COUNT * 60) {
          const top = minutes * PIXELS_PER_MINUTE;
          currentLine = `<div class="current-line" style="top:${top}px;"><span class="current-dot"></span></div>`;
        }
      }

      return `
        <div class="day-column">
          <div class="day-header is-clickable" data-day-header="${toIsoDate(day)}" title="Cambiar dia">${formatDayLabel(day)}</div>
          <div class="day-body" data-day="${toIsoDate(day)}">
            ${currentLine}
            ${blocks}
          </div>
        </div>
      `;
    }

    function applyOverlapLayout() {
      const dayBodies = agendaContainer.querySelectorAll('.day-body');
      dayBodies.forEach((dayBody) => {
        const blocks = Array.from(dayBody.querySelectorAll('.appointment-block'));
        if (!blocks.length) return;
        const items = blocks.map((block) => {
          const start = parseInt(block.dataset.startMin, 10);
          const end = parseInt(block.dataset.endMin, 10);
          return { block, start, end };
        }).filter((item) => !Number.isNaN(item.start) && !Number.isNaN(item.end));
        if (!items.length) return;

        items.sort((a, b) => a.start - b.start || a.end - b.end);
        const groups = [];
        let currentGroup = [];
        let groupEnd = null;
        items.forEach((item) => {
          if (groupEnd === null || item.start >= groupEnd) {
            if (currentGroup.length) groups.push(currentGroup);
            currentGroup = [item];
            groupEnd = item.end;
          } else {
            currentGroup.push(item);
            if (item.end > groupEnd) {
              groupEnd = item.end;
            }
          }
        });
        if (currentGroup.length) groups.push(currentGroup);

        const padding = 6;
        const gap = 6;
        const containerWidth = dayBody.clientWidth;
        const available = Math.max(0, containerWidth - padding * 2);

        groups.forEach((group) => {
          const columns = [];
          group.forEach((item) => {
            let colIndex = columns.findIndex((end) => end <= item.start);
            if (colIndex === -1) {
              colIndex = columns.length;
              columns.push(item.end);
            } else {
              columns[colIndex] = item.end;
            }
            item.colIndex = colIndex;
          });

          const colCount = Math.max(1, columns.length);
          const colWidth = colCount === 1
            ? available
            : (available - gap * (colCount - 1)) / colCount;

          group.forEach((item) => {
            const left = padding + item.colIndex * (colWidth + gap);
            item.block.style.left = `${left}px`;
            item.block.style.width = `${colWidth}px`;
            item.block.style.right = 'auto';
          });
        });
      });
    }

    function renderDayView(date) {
      const dayEntries = filteredEntries().filter((entry) => sameDay(entry.date, date));
      agendaTitle.textContent = `Agenda del dia (${formatDayLabel(date)})`;
      rangeLabel.textContent = formatDayLabel(date);
      calendarPicker.value = toIsoDate(date);

      const html = `
        <div class="scheduler-grid">
          ${buildTimeColumn()}
          <div class="days-grid">
            ${buildDayColumn(date, dayEntries)}
          </div>
        </div>
      `;
      agendaContainer.innerHTML = html;
      applyOverlapLayout();
    }

    function renderWeekView(date) {
      const start = startOfWeek(date);
      const days = Array.from({ length: 7 }, (_, i) => {
        const day = new Date(start);
        day.setDate(start.getDate() + i);
        return day;
      });
      const filtered = filteredEntries();
      agendaTitle.textContent = `Agenda semanal (${formatDayLabel(days[0])} - ${formatDayLabel(days[6])})`;
      rangeLabel.textContent = `${formatDayLabel(days[0])} - ${formatDayLabel(days[6])}`;
      calendarPicker.value = toIsoDate(date);

      const html = `
        <div class="scheduler-grid">
          ${buildTimeColumn()}
          <div class="days-grid">
            ${days.map((day) => buildDayColumn(day, filtered.filter((entry) => sameDay(entry.date, day)))).join('')}
          </div>
        </div>
      `;
      agendaContainer.innerHTML = html;
      applyOverlapLayout();
    }

    function renderMonthView(date) {
      const first = new Date(date.getFullYear(), date.getMonth(), 1);
      const last = new Date(date.getFullYear(), date.getMonth() + 1, 0);
      const offset = (first.getDay() + 6) % 7;
      const totalCells = offset + last.getDate();
      const cells = Array.from({ length: totalCells }, (_, index) => {
        if (index < offset) return null;
        const day = new Date(date.getFullYear(), date.getMonth(), index - offset + 1);
        return day;
      });
      const filtered = filteredEntries();
      agendaTitle.textContent = `Agenda mensual (${formatMonthLabel(date)})`;
      rangeLabel.textContent = formatMonthLabel(date);
      calendarPicker.value = toIsoDate(date);

      agendaContainer.innerHTML = `
        <div class="agenda-month">
          ${cells.map((day) => {
            if (!day) {
              return '<div class="month-cell is-muted"></div>';
            }
            const dayEntries = filtered.filter((entry) => sameDay(entry.date, day));
            const appointmentCount = dayEntries.filter((entry) => entry.type !== 'block').length;
            const blockCount = dayEntries.filter((entry) => entry.type === 'block').length;
            const countLabel = dayEntries.length
              ? `${appointmentCount} citas, ${blockCount} bloqueos`
              : 'Sin reservas';
            return `
              <div class="month-cell">
                <strong>${day.getDate()}</strong>
                <div class="month-count">${countLabel}</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderAgenda() {
      if (currentView === 'week') {
        renderWeekView(selectedDate);
        return;
      }
      if (currentView === 'month') {
        renderMonthView(selectedDate);
        return;
      }
      renderDayView(selectedDate);
    }

    function setActiveView(view) {
      currentView = view;
      viewButtons.forEach((button) => {
        button.classList.toggle('is-active', button.dataset.view === view);
      });
      loadAgenda();
    }

    function rangeForView(date) {
      if (currentView === 'week') {
        const start = startOfWeek(date);
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        return { start, end };
      }
      if (currentView === 'month') {
        const start = new Date(date.getFullYear(), date.getMonth(), 1);
        const end = new Date(date.getFullYear(), date.getMonth() + 1, 0);
        return { start, end };
      }
      return { start: date, end: date };
    }

    function loadServices() {
      return fetch(`${API_BASE}/admin/services?active_only=true&limit=1000&offset=0`)
        .then((response) => response.ok ? response.json() : null)
        .then((payload) => {
          if (!payload) return;
          servicesByName = {};
          const options = payload.items.map((service) => {
            servicesByName[service.name.toLowerCase()] = service;
            return `<option value="${escapeHtml(service.name)}"></option>`;
          }).join('');
          bookingServicesList.innerHTML = options;
          serviceFilter.innerHTML = '<option value="">Todos los servicios</option>' + payload.items.map((service) => {
            return `<option value="${escapeHtml(service.name)}">${escapeHtml(service.name)}</option>`;
          }).join('') + '<option value="Bloqueo">Bloqueo</option>';
        })
        .catch(() => null);
    }

    function loadClients() {
      return fetch(`${API_BASE}/admin/clients?limit=1000&offset=0`)
        .then((response) => response.ok ? response.json() : null)
        .then((payload) => {
          if (!payload) return;
          clientsById = {};
          payload.items.forEach((client) => {
            clientsById[String(client.id)] = client;
          });
          const options = ['<option value="">Seleccionar...</option>', '<option value="__new__">+ Nuevo cliente</option>']
            .concat(payload.items.map((client) => `<option value="${client.id}">${escapeHtml(client.full_name)}</option>`))
            .join('');
          bookingClient.innerHTML = options;
        })
        .catch(() => null);
    }

    function loadAppointments(start, end) {
      const params = new URLSearchParams();
      params.set('start_date', toIsoDate(start));
      params.set('end_date', toIsoDate(end));
      params.set('limit', '1000');
      params.set('offset', '0');
      if (resourceFilter.value) {
        params.set('professional_name', resourceFilter.value);
      }
      if (serviceFilter.value) {
        if (serviceFilter.value === 'Bloqueo') {
          params.set('appointment_type', 'block');
        } else {
          params.set('service_name', serviceFilter.value);
        }
      }
      return fetch(`${API_BASE}/admin/appointments?${params.toString()}`)
        .then((response) => response.ok ? response.json() : null)
        .then((payload) => {
          if (!payload) {
            entries = [];
            appointmentsById = {};
            agendaContainer.innerHTML = '<p class="agenda-empty">No se pudo cargar la agenda.</p>';
            return;
          }
          appointmentsById = {};
          payload.items.forEach((item) => { appointmentsById[item.id] = item; });
          entries = normalizeAppointments(payload.items);
          updateResourceFilter(payload.items);
          renderAgenda();
        })
        .catch(() => {
          entries = [];
          appointmentsById = {};
          agendaContainer.innerHTML = '<p class="agenda-empty">No se pudo cargar la agenda.</p>';
        });
    }

    function loadWorkingHours() {
      return fetch(WORKING_HOURS_URL)
        .then((response) => response.ok ? response.json() : null)
        .then((payload) => {
          if (!payload) {
            workingHoursLoaded = false;
            return;
          }
          workingHoursByWeekday = {};
          (payload.items || []).forEach((item) => {
            workingHoursByWeekday[item.weekday] = item;
          });
          workingHoursLoaded = true;
        })
        .catch(() => {
          workingHoursLoaded = false;
        });
    }

    async function ensureWorkingHoursLoaded() {
      if (workingHoursLoaded) return true;
      await loadWorkingHours();
      return workingHoursLoaded;
    }

    function updateResourceFilter(items) {
      const current = resourceFilter.value;
      const professionals = Array.from(new Set(items.map((item) => item.professional_name).filter(Boolean)));
      const options = ['<option value="">Todos los profesionales</option>']
        .concat(professionals.sort((a, b) => a.localeCompare(b, 'es')).map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`));
      resourceFilter.innerHTML = options.join('');
      if (current && professionals.includes(current)) {
        resourceFilter.value = current;
      }
    }

    function loadAgenda() {
      syncRangeLabel(selectedDate);
      const range = rangeForView(selectedDate);
      loadAppointments(range.start, range.end);
    }

    function resetFormState(options = {}) {
      editingId = null;
      bookingSubmit.textContent = 'Guardar reserva';
      bookingModalTitle.textContent = 'Nueva reserva';
      bookingMessage.textContent = '';
      bookingDelete.dataset.id = '';
      if (!options.skipFormReset) {
        bookingForm.reset();
      }
      bookingDate.valueAsDate = selectedDate;
      bookingStart.value = '11:00';
      bookingEnd.value = '12:00';
      bookingPhone.value = '';
      bookingType.value = 'appointment';
      bookingDelete.hidden = true;
      applyTypeState();
    }

    function fillFormFromItem(item) {
      bookingClient.value = item.client_id ? String(item.client_id) : '';
      bookingPhone.value = item.client_phone || '';
      bookingService.value = item.service_name || '';
      bookingProfessional.value = item.professional_name || '';
      bookingDate.value = item.appointment_date || '';
      bookingStart.value = String(item.start_time || '').slice(0, 5);
      bookingEnd.value = String(item.end_time || '').slice(0, 5);
      bookingType.value = item.appointment_type || 'appointment';
      bookingNotes.value = item.notes || '';
    }

    function startEdit(id) {
      const item = appointmentsById[id];
      if (!item) return;
      editingId = id;
      bookingSubmit.textContent = 'Actualizar reserva';
      bookingModalTitle.textContent = `Editar reserva #${id}`;
      bookingMessage.textContent = `Editando reserva #${id}`;
      fillFormFromItem(item);
      bookingDelete.hidden = false;
      bookingDelete.dataset.id = String(id);
      applyTypeState();
      openModal();
    }

    function startDuplicate(id) {
      const item = appointmentsById[id];
      if (!item) return;
      editingId = null;
      bookingSubmit.textContent = 'Guardar reserva';
      bookingModalTitle.textContent = 'Duplicar reserva';
      bookingMessage.textContent = 'Revisa los datos y guarda la nueva reserva.';
      fillFormFromItem(item);
      bookingDelete.hidden = true;
      bookingDelete.dataset.id = '';
      applyTypeState();
      openModal();
    }

    function openModal() {
      bookingModal.classList.add('is-open');
      bookingModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      bookingModal.classList.remove('is-open');
      bookingModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }

    function applyTypeState() {
      const isBlock = bookingType.value === 'block';
      bookingService.disabled = isBlock;
      bookingClient.disabled = isBlock;
      if (isBlock) {
        bookingClient.value = '';
        bookingPhone.value = '';
        bookingService.value = 'Bloqueo';
      } else if (bookingService.value === 'Bloqueo') {
        bookingService.value = '';
      }
    }

    function openCalendarPicker() {
      calendarPicker.value = toIsoDate(selectedDate);
      if (calendarPicker.showPicker) {
        try {
          calendarPicker.showPicker();
          return;
        } catch (error) {
        }
      }
      calendarPicker.focus();
      calendarPicker.click();
    }

    function minutesToTime(minutes) {
      const total = Math.max(0, Math.min(HOURS_COUNT * 60, minutes));
      const hour = START_HOUR + Math.floor(total / 60);
      const minute = total % 60;
      return `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
    }

    function openCreateAt(date, startMinutes) {
      resetFormState();
      const maxMinutes = HOURS_COUNT * 60;
      let start = Math.max(0, Math.min(maxMinutes, startMinutes));
      if (start > maxMinutes - 60) {
        start = Math.max(0, maxMinutes - 60);
      }
      const end = Math.min(maxMinutes, start + 60);
      bookingDate.value = toIsoDate(date);
      bookingStart.value = minutesToTime(start);
      bookingEnd.value = minutesToTime(end);
      bookingModalTitle.textContent = 'Nueva reserva';
      bookingMessage.textContent = 'Completa los datos para crear la reserva.';
      openModal();
    }

    bookingClient.addEventListener('change', () => {
      if (bookingClient.value === '__new__') {
        openNewClientModal();
        return;
      }
      const client = clientsById[String(bookingClient.value)];
      bookingPhone.value = client ? (client.phone || '') : '';
    });

    bookingType.addEventListener('change', () => {
      applyTypeState();
    });

    bookingForm.addEventListener('reset', () => {
      resetFormState({ skipFormReset: true });
    });

    bookingForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      bookingMessage.textContent = '';

      const clientId = bookingClient.value ? parseInt(bookingClient.value, 10) : null;
      const serviceName = bookingType.value === 'block' ? 'Bloqueo' : bookingService.value.trim();
      const professional = bookingProfessional.value.trim();
      const dateValue = bookingDate.value;
      const startTime = bookingStart.value;
      const endTime = bookingEnd.value;
      const typeValue = bookingType.value;
      const notes = bookingNotes.value.trim();

      if (!professional || !dateValue || !startTime || !endTime) {
        bookingMessage.textContent = 'Completa profesional, fecha y horas.';
        return;
      }
      if (endTime <= startTime) {
        bookingMessage.textContent = 'La hora fin debe ser mayor que la hora inicio.';
        return;
      }
      if (typeValue === 'appointment' && !clientId) {
        bookingMessage.textContent = 'Selecciona un cliente para citas.';
        return;
      }
      if (typeValue === 'appointment' && !serviceName) {
        bookingMessage.textContent = 'Selecciona un tratamiento.';
        return;
      }

      const dateObj = parseDate(dateValue);
      const workingHoursOk = await ensureWorkingHoursLoaded();
      if (!workingHoursOk) {
        bookingMessage.textContent = 'No se pudo validar el horario de trabajo.';
        return;
      }
      const workingHoursError = validateWorkingHours(dateObj, startTime, endTime);
      if (workingHoursError) {
        bookingMessage.textContent = workingHoursError;
        return;
      }

      const matchedService = servicesByName[serviceName.toLowerCase()];
      const payload = {
        client_id: typeValue === 'appointment' ? clientId : null,
        service_id: matchedService ? matchedService.id : null,
        service_name: serviceName || null,
        professional_name: professional,
        appointment_date: dateValue,
        start_time: startTime,
        end_time: endTime,
        appointment_type: typeValue,
        status: 'scheduled',
        notes: notes || null
      };

      try {
        const url = editingId ? `${API_BASE}/appointments/${editingId}` : `${API_BASE}/appointments`;
        const response = await fetch(url, {
          method: editingId ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (response.status === 409) {
          const data = await response.json();
          bookingMessage.textContent = data.detail || 'Conflicto de horario.';
          return;
        }
        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || 'No se pudo guardar la reserva.');
        }
        bookingMessage.textContent = editingId ? 'Reserva actualizada.' : 'Reserva creada.';
        resetFormState();
        closeModal();
        loadAgenda();
      } catch (error) {
        bookingMessage.textContent = error.message;
      }
    });

    async function deleteAppointment(id, { fromModal = false } = {}) {
      if (!id) return;
      if (!confirm('Eliminar esta reserva?')) return;
      if (fromModal) {
        bookingMessage.textContent = '';
      }
      try {
        const response = await fetch(`${API_BASE}/appointments/${id}`, {
          method: 'DELETE'
        });
        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || 'No se pudo eliminar la reserva.');
        }
        if (fromModal) {
          bookingMessage.textContent = 'Reserva eliminada.';
        }
        if (bookingModal.classList.contains('is-open')) {
          resetFormState();
          closeModal();
        }
        loadAgenda();
      } catch (error) {
        if (fromModal) {
          bookingMessage.textContent = error.message;
        } else {
          alert(error.message);
        }
      }
    }

    bookingDelete.addEventListener('click', async () => {
      const rawId = bookingDelete.dataset.id || editingId;
      const id = parseInt(rawId, 10);
      if (Number.isNaN(id)) return;
      await deleteAppointment(id, { fromModal: true });
    });

    agendaContainer.addEventListener('click', (event) => {
      const button = event.target.closest('[data-edit-id]');
      if (button) {
        const id = parseInt(button.dataset.editId, 10);
        if (!Number.isNaN(id)) {
          startEdit(id);
        }
        return;
      }
      const duplicateBtn = event.target.closest('[data-duplicate-id]');
      if (duplicateBtn) {
        const id = parseInt(duplicateBtn.dataset.duplicateId, 10);
        if (!Number.isNaN(id)) {
          startDuplicate(id);
        }
        return;
      }
      const deleteBtn = event.target.closest('[data-delete-id]');
      if (deleteBtn) {
        const id = parseInt(deleteBtn.dataset.deleteId, 10);
        if (!Number.isNaN(id)) {
          deleteAppointment(id);
        }
        return;
      }
      const header = event.target.closest('[data-day-header]');
      if (header) {
        const dayValue = header.dataset.dayHeader;
        const dayDate = parseDate(dayValue);
        if (dayDate) {
          selectedDate = dayDate;
          if (currentView !== 'day') {
            setActiveView('day');
          } else {
            loadAgenda();
          }
        }
        return;
      }
      const dayBody = event.target.closest('.day-body');
      if (dayBody) {
        const dayValue = dayBody.dataset.day;
        const dayDate = parseDate(dayValue);
        if (!dayDate) return;
        const rect = dayBody.getBoundingClientRect();
        const offsetY = event.clientY - rect.top;
        const rawMinutes = offsetY / PIXELS_PER_MINUTE;
        const snapped = Math.round(rawMinutes / 15) * 15;
        openCreateAt(dayDate, snapped);
        return;
      }
      if (event.target.closest('.appointment-block')) {
        return;
      }
    });

    viewButtons.forEach((button) => {
      button.addEventListener('click', () => setActiveView(button.dataset.view));
    });

    resourceFilter.addEventListener('change', loadAgenda);
    serviceFilter.addEventListener('change', loadAgenda);

    todayBtn.addEventListener('click', () => {
      selectedDate = new Date();
      loadAgenda();
    });

    prevBtn.addEventListener('click', () => {
      if (currentView === 'week') {
        selectedDate.setDate(selectedDate.getDate() - 7);
      } else if (currentView === 'month') {
        selectedDate.setMonth(selectedDate.getMonth() - 1);
      } else {
        selectedDate.setDate(selectedDate.getDate() - 1);
      }
      loadAgenda();
    });

    nextBtn.addEventListener('click', () => {
      if (currentView === 'week') {
        selectedDate.setDate(selectedDate.getDate() + 7);
      } else if (currentView === 'month') {
        selectedDate.setMonth(selectedDate.getMonth() + 1);
      } else {
        selectedDate.setDate(selectedDate.getDate() + 1);
      }
      loadAgenda();
    });

    rangeLabel.addEventListener('click', openCalendarPicker);
    function handleCalendarInput() {
      if (!calendarPicker.value) return;
      const date = parseDate(calendarPicker.value);
      if (!date) return;
      applySelectedDate(date);
    }

    calendarPicker.addEventListener('input', handleCalendarInput);
    calendarPicker.addEventListener('change', handleCalendarInput);

    if (calendarPicker) {
      calendarPicker.addEventListener('click', (event) => {
        event.stopPropagation();
      });
    }

    window.addEventListener('resize', () => {
      if (currentView !== 'month') {
        applyOverlapLayout();
      }
    });

    newBookingButton.addEventListener('click', () => {
      resetFormState();
      openModal();
    });

    bookingClose.addEventListener('click', closeModal);

    bookingModal.addEventListener('click', (event) => {
      if (event.target === bookingModal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && bookingModal.classList.contains('is-open')) {
        closeModal();
      }
    });

    function openNewClientModal() {
      newClientForm.reset();
      newClientMessage.textContent = '';
      newClientModal.classList.add('is-open');
      newClientModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function closeNewClientModal() {
      newClientModal.classList.remove('is-open');
      newClientModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      if (bookingClient.value === '__new__') {
        bookingClient.value = '';
      }
    }

    newClientClose.addEventListener('click', closeNewClientModal);
    newClientModal.addEventListener('click', (event) => {
      if (event.target === newClientModal) {
        closeNewClientModal();
      }
    });

    newClientForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      newClientMessage.textContent = '';
      const name = newClientName.value.trim();
      const phone = newClientPhone.value.trim();
      if (!name || !phone) {
        newClientMessage.textContent = 'Nombre y telefono son obligatorios.';
        return;
      }
      const idNumber = newClientIdNumber.value.trim() || `NEW-${Date.now()}`;
      const payload = {
        full_name: name,
        id_number: idNumber,
        phone: phone,
        email: newClientEmail.value.trim() || null
      };
      try {
        const response = await fetch(`${API_BASE}/clients`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || 'No se pudo crear el cliente.');
        }
        const created = await response.json();
        clientsById[String(created.id)] = created;
        const option = document.createElement('option');
        option.value = String(created.id);
        option.textContent = created.full_name;
        bookingClient.appendChild(option);
        bookingClient.value = String(created.id);
        bookingPhone.value = created.phone || '';
        closeNewClientModal();
      } catch (error) {
        newClientMessage.textContent = error.message;
      }
    });

    selectedDate = new Date();
    resetFormState();

    Promise.all([loadServices(), loadClients(), loadWorkingHours()]).finally(loadAgenda);
  </script>
</body>
</html>
