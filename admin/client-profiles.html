<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfiles CRM | Like Studio Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <style>
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .profile-card {
      background: #0f141d;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .profile-header h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .profile-fields label {
      font-size: 0.8rem;
      color: #a5b0c0;
      margin-bottom: 4px;
    }

    .profile-fields input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #2f3a4f;
      background: #171d28;
      color: var(--text);
      font: inherit;
    }

    .profile-fields {
      display: grid;
      gap: 8px;
    }

    .profile-message {
      color: #c7d0df;
      font-size: 0.85rem;
      min-height: 1.1rem;
    }

    @media (max-width: 900px) {
      .profile-grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/imgs/logo.jpg" alt="Like Studio logo" />
      <span>Admin Like Studio</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>
      <a href="index.html">Volver</a>
      <a href="#" onclick="likestudioAdminLogout(); return false;">Cerrar sesion</a>
    </nav>
  </header>

  <main class="form-wrap" style="width:min(1200px,100% - 2rem)">
    <p class="eyebrow">Panel Admin</p>
    <h1>Perfiles CRM</h1>
    <p class="form-note">Tarjetas editables con Instagram, tipo de sesion y fecha.</p>

    <form id="search-form" class="form-grid" style="margin-bottom:14px">
      <div>
        <label for="query">Buscar</label>
        <input id="query" name="query" placeholder="Nombre, telefono o Instagram" />
      </div>
      <div style="display:flex;align-items:flex-end;gap:8px;">
        <button class="btn" type="submit">Buscar</button>
        <button class="btn btn-ghost" type="button" id="reset">Limpiar</button>
      </div>
    </form>

    <p id="summary" class="form-note">Cargando...</p>
    <div id="profile-grid" class="profile-grid"></div>

    <div class="form-actions" style="justify-content:space-between;margin-top:16px;">
      <button id="prev" class="btn btn-ghost" type="button">Anterior</button>
      <button id="next" class="btn btn-ghost" type="button">Siguiente</button>
    </div>
  </main>

  <script src="../static/js/admin-auth.js"></script>
  <script src="../static/js/app-config.js"></script>
  <script src="../static/js/site.js"></script>
  <script>
    const API_URL = `${window.APP_CONFIG.API_BASE_URL}/admin/client-profiles`;
    const CLIENT_URL = `${window.APP_CONFIG.API_BASE_URL}/admin/clients`;
    const limit = 24;
    let offset = 0;
    let lastTotal = 0;

    const form = document.getElementById('search-form');
    const summary = document.getElementById('summary');
    const grid = document.getElementById('profile-grid');

    function collectParams() {
      const data = new FormData(form);
      const params = new URLSearchParams();
      const query = data.get('query');
      if (query) params.set('query', query);
      params.set('limit', String(limit));
      params.set('offset', String(offset));
      return params;
    }

    function renderCards(items) {
      if (!items.length) {
        grid.innerHTML = '<p class="form-note">Sin resultados.</p>';
        return;
      }

      grid.innerHTML = items.map((item) => `
        <article class="profile-card" data-client-id="${item.client_id}" data-id-number="${item.id_number}" data-email="${item.email || ''}">
          <div class="profile-header">
            <h3>${item.full_name}</h3>
            <span>#${item.client_id}</span>
          </div>
          <div class="profile-fields">
            <div>
              <label>Nombre</label>
              <input data-field="full_name" value="${item.full_name || ''}" />
            </div>
            <div>
              <label>Telefono</label>
              <input data-field="phone" value="${item.phone || ''}" />
            </div>
            <div>
              <label>Instagram</label>
              <input data-field="instagram" value="${item.instagram || ''}" />
            </div>
            <div>
              <label>Tipo de sesion</label>
              <input data-field="shoot_type" value="${item.shoot_type || ''}" />
            </div>
            <div>
              <label>Fecha</label>
              <input data-field="shoot_date" type="date" value="${item.shoot_date || ''}" />
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-sm" type="button" data-save>Guardar</button>
          </div>
          <p class="profile-message" data-message></p>
        </article>
      `).join('');
    }

    async function loadProfiles() {
      summary.textContent = 'Cargando...';
      try {
        const response = await fetch(`${API_URL}?${collectParams().toString()}`);
        if (!response.ok) throw new Error('No se pudieron obtener los perfiles.');
        const payload = await response.json();
        lastTotal = payload.total;
        renderCards(payload.items);
        const from = payload.total === 0 ? 0 : payload.offset + 1;
        const to = Math.min(payload.offset + payload.limit, payload.total);
        summary.textContent = `Mostrando ${from}-${to} de ${payload.total} perfiles.`;
        document.getElementById('prev').disabled = payload.offset <= 0;
        document.getElementById('next').disabled = payload.offset + payload.limit >= payload.total;
      } catch (error) {
        summary.textContent = error.message;
        grid.innerHTML = '';
      }
    }

    grid.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-save]');
      if (!button) return;
      const card = button.closest('.profile-card');
      if (!card) return;
      const clientId = card.dataset.clientId;
      const idNumber = card.dataset.idNumber;
      const email = card.dataset.email || null;
      const message = card.querySelector('[data-message]');
      const fullName = card.querySelector('[data-field="full_name"]').value.trim();
      const phone = card.querySelector('[data-field="phone"]').value.trim();
      const instagram = card.querySelector('[data-field="instagram"]').value.trim();
      const shootType = card.querySelector('[data-field="shoot_type"]').value.trim();
      const shootDate = card.querySelector('[data-field="shoot_date"]').value;

      message.textContent = 'Guardando...';
      if (!fullName) {
        message.textContent = 'El nombre es obligatorio.';
        return;
      }

      try {
        const clientResponse = await fetch(`${CLIENT_URL}/${clientId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: fullName,
            id_number: idNumber,
            phone: phone || null,
            email: email
          })
        });

        if (!clientResponse.ok) {
          const data = await clientResponse.json();
          throw new Error(data.detail || 'No se pudo actualizar el cliente.');
        }

        const profileResponse = await fetch(`${API_URL}/${clientId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            instagram: instagram || null,
            shoot_type: shootType || null,
            shoot_date: shootDate || null
          })
        });

        if (!profileResponse.ok) {
          const data = await profileResponse.json();
          throw new Error(data.detail || 'No se pudo actualizar el perfil.');
        }

        message.textContent = 'Guardado.';
      } catch (error) {
        message.textContent = error.message;
      }
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      offset = 0;
      loadProfiles();
    });

    document.getElementById('reset').addEventListener('click', () => {
      form.reset();
      offset = 0;
      loadProfiles();
    });

    document.getElementById('prev').addEventListener('click', () => {
      offset = Math.max(0, offset - limit);
      loadProfiles();
    });

    document.getElementById('next').addEventListener('click', () => {
      if (offset + limit < lastTotal) {
        offset += limit;
        loadProfiles();
      }
    });

    loadProfiles();
  </script>
</body>
</html>
