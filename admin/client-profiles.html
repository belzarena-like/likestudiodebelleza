  <header class="topbar">

      <span>Admin Like Studio</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>

      <a href="clients.html">Clientes</a>

      <a href="booking-draft.html">Agenda</a>

    <h1 class="page-title">Perfiles CRM</h1>

    <form id="search-form" class="admin-filters">
      <div class="admin-filter-field wide">
        <label class="filter-label" for="query">Buscar</label>

      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" type="submit">Buscar</button>
        <button class="btn btn-secondary" type="button" id="reset">Limpiar</button>
      </div>
    </form>

    <p id="summary" class="admin-summary">Cargando...</p>
    <div id="profile-grid" class="profile-grid"></div>

    <div class="admin-pagination" style="margin-top:1.5rem">
      <button id="prev" class="btn btn-secondary" type="button">← Anterior</button>
      <button id="next" class="btn btn-secondary" type="button">Siguiente →</button>
    </div>
