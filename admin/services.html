<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicios | Like Studio Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <style>
    .admin-summary {
      color: #d9e1ee;
    }

    body.modal-open {
      overflow: hidden;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 18, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-overlay.is-open {
      display: flex;
    }

    .modal-card {
      width: min(620px, 100%);
      background: #0f141d;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      max-height: calc(100vh - 32px);
      overflow: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .admin-table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0f141d;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      color: #e7edf8;
    }

    .admin-table thead tr {
      background: #222d3f;
      text-align: left;
    }

    .admin-table th,
    .admin-table td {
      padding: 10px;
      border-top: 1px solid #2a354a;
    }

    .admin-empty {
      color: #c8d2e3;
      padding: 12px;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    @media (max-width: 900px) {
      .admin-table {
        min-width: 620px;
        font-size: 0.88rem;
      }
      .admin-table th,
      .admin-table td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/imgs/logo.jpg" alt="Like Studio logo" />
      <span>Admin Like Studio</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>
      <a href="index.html">Volver</a>
      <a href="#" onclick="likestudioAdminLogout(); return false;">Cerrar sesion</a>
    </nav>
  </header>

  <main class="form-wrap" style="width:min(1200px,100% - 2rem)">
    <p class="eyebrow">Panel Admin</p>
    <h1>Servicios</h1>
    <p class="form-note">Gestiona el listado de tratamientos disponibles para reservas.</p>

    <div class="form-actions" style="margin: 0 0 16px;">
      <button id="open-service-modal" class="btn btn-sm" type="button">Nuevo servicio</button>
    </div>

    <form id="search-form" class="form-grid" style="margin-bottom:14px">
      <div>
        <label for="query">Buscar</label>
        <input id="query" name="query" />
      </div>
      <div>
        <label for="active_only">Solo activos</label>
        <select id="active_only" name="active_only">
          <option value="false">No</option>
          <option value="true">Si</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end;gap:8px;">
        <button class="btn" type="submit">Buscar</button>
        <button class="btn btn-ghost" type="button" id="search-reset">Limpiar</button>
      </div>
    </form>

    <p id="summary" class="form-note admin-summary">Cargando...</p>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Servicio</th>
            <th>Activo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="form-actions" style="justify-content:space-between;">
      <button id="prev" class="btn btn-ghost" type="button">Anterior</button>
      <button id="next" class="btn btn-ghost" type="button">Siguiente</button>
    </div>
  </main>

  <div class="modal-overlay" id="service-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="service-modal-title">
      <div class="modal-header">
        <div>
          <p class="eyebrow">Servicio</p>
          <h2 id="service-modal-title">Nuevo servicio</h2>
        </div>
        <button id="service-close" class="btn btn-ghost btn-sm" type="button">Cerrar</button>
      </div>
      <form id="service-form" class="form-grid">
        <input type="hidden" id="service-id" />
        <div>
          <label for="service-name">Nombre del servicio</label>
          <input id="service-name" required />
        </div>
        <div>
          <label for="service-active">Activo</label>
          <select id="service-active">
            <option value="true">Si</option>
            <option value="false">No</option>
          </select>
        </div>
        <div class="form-actions form-grid-1">
          <button class="btn" type="submit" id="service-submit">Guardar</button>
          <button class="btn btn-ghost" type="button" id="service-reset">Limpiar</button>
        </div>
        <p id="service-message" class="form-note form-grid-1"></p>
      </form>
    </div>
  </div>

  <script src="../static/js/admin-auth.js"></script>
  <script src="../static/js/app-config.js"></script>
  <script src="../static/js/site.js"></script>
  <script>
    const API_URL = `${window.APP_CONFIG.API_BASE_URL}/admin/services`;
    const limit = 50;
    let offset = 0;
    let lastTotal = 0;

    const form = document.getElementById('search-form');
    const summary = document.getElementById('summary');
    const tableBody = document.getElementById('table-body');

    const serviceForm = document.getElementById('service-form');
    const serviceIdInput = document.getElementById('service-id');
    const serviceNameInput = document.getElementById('service-name');
    const serviceActiveInput = document.getElementById('service-active');
    const serviceMessage = document.getElementById('service-message');
    const serviceSubmit = document.getElementById('service-submit');
    const serviceModal = document.getElementById('service-modal');
    const serviceModalTitle = document.getElementById('service-modal-title');
    const serviceClose = document.getElementById('service-close');
    const serviceReset = document.getElementById('service-reset');
    const openServiceModalButton = document.getElementById('open-service-modal');

    function openServiceModal() {
      serviceModal.classList.add('is-open');
      serviceModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function closeServiceModal() {
      serviceModal.classList.remove('is-open');
      serviceModal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }

    function collectParams() {
      const data = new FormData(form);
      const params = new URLSearchParams();
      const query = data.get('query');
      const activeOnly = data.get('active_only');
      if (query) params.set('query', query);
      if (activeOnly) params.set('active_only', activeOnly);
      params.set('limit', String(limit));
      params.set('offset', String(offset));
      return params;
    }

    function resetForm() {
      serviceIdInput.value = '';
      serviceNameInput.value = '';
      serviceActiveInput.value = 'true';
      serviceSubmit.textContent = 'Guardar';
      serviceMessage.textContent = '';
      serviceModalTitle.textContent = 'Nuevo servicio';
    }

    function renderRows(items) {
      if (!items.length) {
        tableBody.innerHTML = '<tr><td class="admin-empty" colspan="3">Sin resultados.</td></tr>';
        return;
      }

      tableBody.innerHTML = items.map((item) => `
        <tr>
          <td>${item.name}</td>
          <td>${item.active ? 'Si' : 'No'}</td>
          <td>
            <div class="admin-actions">
              <button class="btn btn-ghost btn-sm" type="button" data-edit-id="${item.id}">Editar</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function loadServices() {
      summary.textContent = 'Cargando...';
      try {
        const response = await fetch(`${API_URL}?${collectParams().toString()}`);
        if (!response.ok) throw new Error('No se pudieron obtener los servicios.');
        const payload = await response.json();
        lastTotal = payload.total;
        renderRows(payload.items);

        const from = payload.total === 0 ? 0 : payload.offset + 1;
        const to = Math.min(payload.offset + payload.limit, payload.total);
        summary.textContent = `Mostrando ${from}-${to} de ${payload.total} servicios.`;

        document.getElementById('prev').disabled = payload.offset <= 0;
        document.getElementById('next').disabled = payload.offset + payload.limit >= payload.total;
      } catch (error) {
        summary.textContent = error.message;
        tableBody.innerHTML = '';
      }
    }

    serviceForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      serviceMessage.textContent = '';
      const name = serviceNameInput.value.trim();
      if (!name) {
        serviceMessage.textContent = 'Ingresa un nombre.';
        return;
      }
      const payload = {
        name: name,
        active: serviceActiveInput.value === 'true'
      };
      try {
        const serviceId = serviceIdInput.value;
        const response = await fetch(serviceId ? `${API_URL}/${serviceId}` : API_URL, {
          method: serviceId ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || 'No se pudo guardar el servicio.');
        }
        resetForm();
        closeServiceModal();
        loadServices();
      } catch (error) {
        serviceMessage.textContent = error.message;
      }
    });

    serviceReset.addEventListener('click', () => {
      resetForm();
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      offset = 0;
      loadServices();
    });

    document.getElementById('search-reset').addEventListener('click', () => {
      form.reset();
      offset = 0;
      loadServices();
    });

    document.getElementById('prev').addEventListener('click', () => {
      offset = Math.max(0, offset - limit);
      loadServices();
    });

    document.getElementById('next').addEventListener('click', () => {
      if (offset + limit < lastTotal) {
        offset += limit;
        loadServices();
      }
    });

    tableBody.addEventListener('click', (event) => {
      const button = event.target.closest('[data-edit-id]');
      if (!button) return;
      const row = button.closest('tr');
      if (!row) return;
      const name = row.children[0].textContent;
      const active = row.children[1].textContent === 'Si';
      serviceIdInput.value = button.dataset.editId;
      serviceNameInput.value = name;
      serviceActiveInput.value = active ? 'true' : 'false';
      serviceSubmit.textContent = 'Actualizar';
      serviceModalTitle.textContent = `Editar servicio #${button.dataset.editId}`;
      serviceMessage.textContent = '';
      openServiceModal();
    });

    openServiceModalButton.addEventListener('click', () => {
      resetForm();
      openServiceModal();
    });

    serviceClose.addEventListener('click', closeServiceModal);
    serviceModal.addEventListener('click', (event) => {
      if (event.target === serviceModal) {
        closeServiceModal();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && serviceModal.classList.contains('is-open')) {
        closeServiceModal();
      }
    });

    resetForm();
    loadServices();
  </script>
</body>
</html>
