<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicios | Like Studio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <link rel="stylesheet" href="../css/admin-common.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/imgs/logo.jpg" alt="Like Studio logo" />
      <span>Admin Like Studio</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>
      <a href="index.html">Consentimientos</a>
      <a href="clients.html">Clientes</a>
      <a href="sessions.html">Sesiones</a>
      <a href="booking-draft.html">Agenda</a>
      <a href="services.html">Servicios</a>
      <a href="working-hours.html">Horario</a>
      <a href="../index.html">Web publica</a>
      <a href="#" onclick="likestudioAdminLogout(); return false;">Cerrar sesion</a>
    </nav>
  </header>

  <main class="admin-page-main">
    <p class="page-eyebrow">Panel Admin</p>
    <h1 class="page-title">Servicios</h1>
    <p class="page-subtitle">Gestiona los tratamientos disponibles para reservas.</p>

    <div class="admin-toolbar">
      <button id="new-service" class="btn btn-primary" type="button">+ Nuevo servicio</button>
    </div>

    <form id="search-form" class="admin-filters">
      <div class="admin-filter-field wide">
        <label class="filter-label" for="query">Buscar</label>
        <input class="filter-input" id="query" name="query" placeholder="Nombre del servicio..." />
      </div>
      <div class="admin-filter-field narrow">
        <label class="filter-label" for="active_only">Estado</label>
        <select class="filter-select" id="active_only" name="active_only">
          <option value="false">Todos</option>
          <option value="true">Solo activos</option>
        </select>
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" type="submit">Buscar</button>
        <button class="btn btn-secondary" type="button" id="reset">Limpiar</button>
      </div>
    </form>

    <p id="summary" class="admin-summary">Cargando...</p>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Servicio</th>
            <th>Duración</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="admin-pagination">
      <button id="prev" class="btn btn-secondary" type="button">← Anterior</button>
      <button id="next" class="btn btn-secondary" type="button">Siguiente →</button>
    </div>
  </main>

  <!-- Service modal -->
  <div class="modal-overlay" id="service-modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Nuevo servicio</h2>
        <button id="modal-close" class="btn btn-secondary btn-sm" type="button">✕ Cerrar</button>
      </div>
      <form id="service-form" class="form-grid">
        <input type="hidden" id="f-id" />
        <div class="form-field form-grid-full">
          <label for="f-name">Nombre del servicio</label>
          <input id="f-name" required />
        </div>
        <div class="form-field">
          <label for="f-duration">Duración (min)</label>
          <input id="f-duration" type="number" min="15" max="480" step="15" value="60" required />
        </div>
        <div class="form-field">
          <label for="f-active">Estado</label>
          <select id="f-active">
            <option value="true">Activo</option>
            <option value="false">Inactivo</option>
          </select>
        </div>
        <div class="form-actions form-grid-full">
          <button id="submit-btn" class="btn btn-primary" type="submit">Guardar</button>
          <button id="form-reset" class="btn btn-secondary" type="button">Limpiar</button>
        </div>
        <p id="form-message" class="form-message form-grid-full"></p>
      </form>
    </div>
  </div>

  <script src="../static/js/admin-auth.js"></script>
  <script src="../static/js/app-config.js"></script>
  <script src="../static/js/site.js"></script>
  <script src="js/services.js"></script>
</body>
</html>
