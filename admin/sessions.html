<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sesiones del Día | Like Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <link rel="stylesheet" href="../css/admin-sessions-modern.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/imgs/logo.jpg" alt="Like Studio logo" />
      <span>Admin Like Studio</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>
      <a href="index.html">Consentimientos</a>
      <a href="clients.html">Clientes</a>
      <a href="sessions.html">Sesiones</a>
      <a href="booking-draft.html">Agenda</a>
      <a href="services.html">Servicios</a>
      <a href="working-hours.html">Horario</a>
      <a href="../index.html">Web publica</a>
      <a href="#" onclick="likestudioAdminLogout(); return false;">Cerrar sesion</a>
    </nav>
  </header>

  <div class="sessions-container">
    <div class="sessions-header">
      <h1 class="sessions-title">Sesiones del Día</h1>
      <p class="sessions-subtitle">Citas y sesiones de tratamiento</p>
    </div>

    <div class="filters-bar">
      <div class="filter-group">
        <label class="filter-label" for="date-filter">Fecha <button type="button" id="clear-date" class="btn-inline-clear" title="Limpiar fecha para buscar por nombre">✕ limpiar</button></label>
        <input type="date" id="date-filter" class="filter-input" />
      </div>
      <div class="filter-group">
        <label class="filter-label" for="professional-filter">Profesional</label>
        <select id="professional-filter" class="filter-select">
          <option value="">Todos</option>
          <option value="Josemi">Josemi</option>
          <option value="Liege">Liege</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-label" for="search-filter">Buscar cliente</label>
        <input type="text" id="search-filter" class="filter-input" placeholder="Nombre o teléfono..." />
      </div>
      <div class="filter-actions">
        <button class="btn btn-secondary btn-sm" id="reset-filters">Limpiar</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Citas de Hoy</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pendientes</div>
        <div class="stat-value" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completadas</div>
        <div class="stat-value" id="stat-completed">—</div>
      </div>
    </div>

    <div id="sessions-list" class="client-cards"></div>
  </div>

  <script src="../static/js/admin-auth.js"></script>
  <script src="../static/js/app-config.js"></script>
  <script src="../static/js/admin-widgets.js"></script>
  <script src="../static/js/site.js"></script>
  <script src="js/sessions-modern.js"></script>
</body>
</html>
