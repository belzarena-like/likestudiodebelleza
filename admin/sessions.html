<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Sesiones | Like Studio Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <style>
    .admin-summary {
      color: #d9e1ee;
    }

    .admin-table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0f141d;
    }

    .admin-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
      min-width: 1080px;
      color: #e7edf8;
    }

    .admin-table thead tr {
      background: #222d3f;
      text-align: left;
    }

    .admin-table th {
      padding: 12px 10px;
      border-top: 1px solid #2a354a;
    }

    .admin-table td {
      padding: 14px 10px;
      background: #121822;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .admin-table tbody tr td:first-child {
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }

    .admin-table tbody tr td:last-child {
      border-top-right-radius: 12px;
      border-bottom-right-radius: 12px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .admin-empty {
      color: #c8d2e3;
      padding: 12px;
    }

    .session-agenda {
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0f141d;
    }

    .session-list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .session-card {
      border: 1px solid #2a354a;
      border-radius: 12px;
      padding: 14px;
      background: #121822;
      display: grid;
      gap: 10px;
    }

    .session-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px 16px;
      align-items: flex-start;
    }

    .session-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #eef3fb;
      margin-bottom: 6px;
    }

    .session-time {
      text-align: right;
      color: #d6dfef;
      font-weight: 600;
      min-width: 160px;
    }

    .session-service {
      font-size: 0.9rem;
      color: #c7d0df;
      font-weight: 500;
    }

    .session-submeta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.85rem;
    }

    .session-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #2a354a;
      background: #141b26;
      color: #c7d0df;
    }

    .session-chip.status-planned {
      border-color: #3a4863;
    }

    .session-chip.status-in-progress {
      border-color: #4b5f7a;
      color: #e5eefc;
      background: #152033;
    }

    .session-chip.status-completed {
      border-color: #2f6b4a;
      color: #c1f3d8;
      background: #10261a;
    }

    .session-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
    }

    .session-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 120px;
    }

    .session-field label {
      font-size: 0.8rem;
      color: #b7c3d8;
    }

    .session-field input[type="number"] {
      width: 90px;
    }

    .session-note-field {
      flex: 1 1 260px;
      min-width: 200px;
    }

    .session-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .session-meta {
      color: #c7d0df;
      font-size: 0.9rem;
    }

    .session-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
      align-items: center;
    }

    .session-note-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0f141d;
      color: #e7edf8;
    }

    .session-message {
      margin: 6px 0 0;
      color: #d9e1ee;
      font-size: 0.85rem;
      min-height: 1.1rem;
    }

    .session-client {
      font-weight: 700;
      font-size: 1rem;
    }

    .session-sub {
      color: #9fb0c7;
      font-size: 0.82rem;
      margin-top: 4px;
    }

    .session-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .session-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d7dfec;
    }

    .session-notes {
      font-size: 0.82rem;
      color: #d0d9e7;
      line-height: 1.4;
      white-space: normal;
      max-width: 260px;
    }

    .session-actions-cell {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .session-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-danger {
      border-color: rgba(255, 77, 109, 0.4);
      color: #ff8aa0;
    }

    .btn-danger:hover {
      background: rgba(255, 77, 109, 0.12);
    }

    .history-row td {
      padding: 0;
      border-top: none;
    }

    .history-panel {
      border-top: 1px solid #2a354a;
      background: #10151f;
      padding: 12px;
    }

    .history-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-form {
      margin-top: 10px;
      padding: 10px;
      border: 1px dashed #2a354a;
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
    }

    .history-form .form-grid-1 {
      grid-column: 1 / -1;
    }

    .bonus-form {
      margin-top: 10px;
      padding: 10px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .bonus-form input {
      width: 120px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .history-item {
      border: 1px solid #2a354a;
      border-radius: 10px;
      padding: 8px 10px;
      background: #121822;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #d9e1ee;
    }

    .history-item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-item strong {
      font-size: 0.9rem;
    }

    .history-meta {
      font-size: 0.82rem;
      color: #c7d0df;
    }

    .history-status {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
    }

    .session-group-row td {
      background: #161d2a;
      font-weight: 700;
      color: #e4ecf7;
      border-top: 1px solid #2a354a;
    }

    .session-group-row small {
      font-weight: 500;
      color: #b6c2d8;
    }

    @media (max-width: 900px) {
      .admin-table {
        min-width: 760px;
        font-size: 0.88rem;
      }
      .admin-table th,
      .admin-table td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">
      <img class="brand-logo" src="../assets/imgs/logo.jpg" alt="Like Studio logo" />
      <span>Admin Like Studio</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>
      <a href="index.html">Consentimientos</a>
      <a href="clients.html">Clientes</a>
      <a href="client-profiles.html">Perfiles CRM</a>
      <a href="sessions.html">Sesiones</a>
      <a href="booking-draft.html">Booking / Agenda</a>
      <a href="services.html">Servicios</a>
      <a href="working-hours.html">Horario</a>
      <a href="../index.html">Web publica</a>
      <a href="#" onclick="likestudioAdminLogout(); return false;">Cerrar sesion</a>
    </nav>
  </header>

  <main class="form-wrap" style="width:min(1200px,100% - 2rem)">
    <p class="eyebrow">Panel Admin</p>
    <h1>Sesiones de tratamiento</h1>

    <section class="session-agenda">
      <div class="section-head" style="margin-bottom:10px;">
        <p class="eyebrow">Agenda de sesiones</p>
        <h2 style="font-size:1.4rem;margin-bottom:6px;">Citas de hoy con sesiones</h2>
      </div>
      <div class="form-grid">
        <div>
          <label for="agenda-date">Fecha</label>
          <input id="agenda-date" type="date" />
        </div>
        <div>
          <label for="agenda-professional">Profesional</label>
          <select id="agenda-professional">
            <option value="">Todos</option>
            <option value="Josemi">Josemi</option>
            <option value="Liege">Liege</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end;gap:8px;">
          <button id="agenda-refresh" class="btn btn-ghost" type="button">Actualizar</button>
        </div>
      </div>
      <div id="agenda-list" class="session-list"></div>
    </section>

    <form id="search-form" class="form-grid" style="margin-bottom:14px">
      <div>
        <label for="query">Cliente</label>
        <input id="query" name="query" placeholder="Nombre o telefono" />
      </div>
      <div>
        <label for="treatment_name">Tratamiento</label>
        <input id="treatment_name" name="treatment_name" />
      </div>
      <div>
        <label for="status">Estado</label>
        <select id="status" name="status">
          <option value="">Todos</option>
          <option value="planned">Planificado</option>
          <option value="in_progress">En progreso</option>
          <option value="completed">Completado</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end;gap:8px;">
        <button class="btn" type="submit">Buscar</button>
        <button class="btn btn-ghost" type="button" id="reset">Limpiar</button>
      </div>
    </form>

    <p id="summary" class="form-note admin-summary">Cargando...</p>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Planificacion</th>
            <th>Estado</th>
            <th>Notas</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="form-actions" style="justify-content:space-between;">
      <button id="prev" class="btn btn-ghost" type="button">Anterior</button>
      <button id="next" class="btn btn-ghost" type="button">Siguiente</button>
    </div>
  </main>

  <script src="../static/js/admin-auth.js"></script>
  <script src="../static/js/app-config.js"></script>
  <script src="../static/js/admin-widgets.js"></script>
  <script src="../static/js/site.js"></script>
  <script>
    const API_URL = `${window.APP_CONFIG.API_BASE_URL}/admin/sessions`;
    const AGENDA_URL = `${window.APP_CONFIG.API_BASE_URL}/admin/session-agenda`;
    const ATTENDANCE_URL = `${window.APP_CONFIG.API_BASE_URL}/admin/session-attendance`;
    const CONSENT_STORAGE_KEY = 'likestudio_client_prefill_v1';
    const limit = 20;
    let offset = 0;
    let lastTotal = 0;

    const form = document.getElementById('search-form');
    const summary = document.getElementById('summary');
    const tableBody = document.getElementById('table-body');
    const clientQueryInput = document.getElementById('query');
    const agendaDate = document.getElementById('agenda-date');
    const agendaProfessional = document.getElementById('agenda-professional');
    const agendaList = document.getElementById('agenda-list');
    const agendaRefresh = document.getElementById('agenda-refresh');
    const historyCache = {};
    const consentPrefillByAppointment = {};
    const consentPrefillBySession = {};

    function storeConsentPrefill(data) {
      if (!data) return;
      const payload = {
        full_name: data.full_name || '',
        id_number: data.id_number || '',
        phone: data.phone || '',
        email: data.email || ''
      };
      try {
        localStorage.setItem(CONSENT_STORAGE_KEY, JSON.stringify(payload));
      } catch (error) {
        // Ignore storage failures.
      }
    }

    function resolveConsentPath(treatmentName) {
      const value = String(treatmentName || '').toLowerCase();
      if (value.includes('capilar')) return 'consent-capilar-condiciones.html';
      if (value.includes('eliminacion') || value.includes('tatuaje')) return 'consent-eliminacion-laser.html';
      if (value.includes('laser') || value.includes('depil')) return 'consent-laser.html';
      if (value.includes('estet')) return 'consent-estetico.html';
      return 'consent-micropigmentacion.html';
    }

    function openConsent(prefill, treatmentName, professionalName) {
      storeConsentPrefill(prefill);
      const params = new URLSearchParams();
      if (prefill && prefill.full_name) params.set('client_name', prefill.full_name);
      if (prefill && prefill.id_number) params.set('client_id_number', prefill.id_number);
      if (prefill && prefill.phone) params.set('client_phone', prefill.phone);
      if (treatmentName) params.set('service_name', treatmentName);
      if (professionalName) params.set('professional_name', professionalName);
      const path = `consent-selector.html?${params.toString()}`;
      window.open(path, '_blank', 'noopener');
    }

    function collectParams() {
      const data = new FormData(form);
      const params = new URLSearchParams();
      ['query', 'treatment_name', 'status'].forEach((key) => {
        const value = data.get(key);
        if (value) params.set(key, value);
      });
      params.set('limit', String(limit));
      params.set('offset', String(offset));
      return params;
    }

    function renderAgenda(items) {
      if (!items.length) {
        agendaList.innerHTML = '<p class="form-note">No hay sesiones programadas para este dia.</p>';
        return;
      }

      items.forEach((item) => {
        consentPrefillByAppointment[item.appointment_id] = {
          full_name: item.client_name,
          id_number: '',
          phone: item.client_phone || '',
          email: '',
          treatment: item.service_name,
          professional_name: item.professional_name
        };
      });

      const statusLabels = {
        planned: 'Planificado',
        in_progress: 'En progreso',
        completed: 'Completado'
      };

      agendaList.innerHTML = items.map((item) => `
        <article class="session-card" data-session-id="${item.session_id}" data-appointment-id="${item.appointment_id}">
          <div class="session-header">
            <div>
              <div class="session-title">${item.client_name}</div>
              <div class="session-submeta">
                <span class="session-chip">${item.professional_name}</span>
                <span class="session-chip">Sesiones ${item.completed_sessions}/${item.planned_sessions}</span>
                <span class="session-chip status-${String(item.status || 'planned').replace('_', '-')}">
                  ${statusLabels[item.status] || statusLabels.planned}
                </span>
              </div>
            </div>
            <div class="session-time">
              <div>${item.start_time} - ${item.end_time}</div>
              <div class="session-service">${item.service_name}</div>
            </div>
          </div>
          <div class="session-controls">
            <div class="session-field">
              <label>Completadas</label>
              <input type="number" min="0" max="${item.planned_sessions}" value="${item.completed_sessions}" data-field="completed" />
            </div>
            <div class="session-field session-note-field">
              <label>Nota</label>
              <input class="session-note-input" type="text" placeholder="Escribe una nota" value="${item.notes || ''}" data-field="notes" />
            </div>
            <div class="session-actions">
              <button class="btn btn-sm" type="button" data-attend="yes">Asistio</button>
              <button class="btn btn-ghost btn-sm" type="button" data-attend="no">No asistio</button>
              <button class="btn btn-ghost btn-sm" type="button" data-save-session>Guardar detalles</button>
              <button class="btn btn-ghost btn-sm" type="button" data-consent-appointment="${item.appointment_id}">Consentimiento</button>
            </div>
          </div>
          <p class="session-message" data-message></p>
        </article>
      `).join('');
    }

    async function loadAgenda() {
      const dateValue = agendaDate.value;
      if (!dateValue) return;
      agendaList.innerHTML = '<p class="form-note">Cargando...</p>';
      try {
        const response = await fetch(`${AGENDA_URL}?date=${dateValue}`);
        if (!response.ok) throw new Error('No se pudo cargar la agenda de sesiones.');
        const payload = await response.json();
        let items = payload.items || [];
        if (agendaProfessional && agendaProfessional.value) {
          const filter = agendaProfessional.value.toLowerCase();
          items = items.filter((item) => String(item.professional_name || '').toLowerCase() === filter);
        }
        renderAgenda(items);
      } catch (error) {
        agendaList.innerHTML = `<p class="form-note">${error.message}</p>`;
      }
    }

    function renderRows(items) {
      if (!items.length) {
        tableBody.innerHTML = '<tr><td class="admin-empty" colspan="5">Sin resultados.</td></tr>';
        return;
      }

      items.forEach((item) => {
        consentPrefillBySession[item.id] = {
          full_name: item.client_name,
          id_number: item.client_id_number || '',
          phone: item.client_phone || '',
          email: '',
          treatment: item.treatment_name,
          professional_name: item.professional_name
        };
      });

      const activeQuery = clientQueryInput ? String(clientQueryInput.value || '').trim() : '';
      const groups = new Map();
      items.forEach((item) => {
        const key = item.client_phone || 'Sin telefono';
        if (activeQuery && key === 'Sin telefono') {
          return;
        }
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      });

      const rows = [];
      groups.forEach((groupItems, phone) => {
        const names = Array.from(new Set(groupItems.map((item) => item.client_name).filter(Boolean)));
        const nameLabel = names.length ? ` · ${names.join(', ')}` : '';
        rows.push(`
          <tr class="session-group-row">
            <td colspan="5">Telefono: ${phone}${nameLabel} · ${groupItems.length} sesiones</td>
          </tr>
        `);
        groupItems.forEach((item) => {
          rows.push(`
            <tr data-session-row="${item.id}">
              <td>
                <div class="session-client">${item.client_name}</div>
                <div class="session-sub">${item.client_phone || '-'}</div>
                <div class="session-badges">
                  <span class="session-badge">${item.treatment_name}</span>
                </div>
              </td>
              <td>
                <div class="session-badges">
                  <span class="session-badge">${item.completed_sessions}/${item.planned_sessions} sesiones</span>
                </div>
                <div class="session-sub">Creado ${item.created_at}</div>
              </td>
              <td>
                <span class="session-badge">${item.status}</span>
              </td>
              <td>
                <div class="session-notes">${item.notes || 'Sin notas'}</div>
              </td>
              <td>
                <div class="session-actions-cell">
                  <div class="session-actions-row">
                    <button class="btn btn-ghost btn-sm" type="button" data-consent-session="${item.id}">Consentimiento</button>
                    <button class="btn btn-ghost btn-sm" type="button" data-history-toggle="${item.id}">Historial</button>
                    <button class="btn btn-ghost btn-sm btn-danger" type="button" data-session-delete="${item.id}">Eliminar</button>
                  </div>
                </div>
              </td>
            </tr>
            <tr class="history-row" data-history-row="${item.id}" hidden>
              <td colspan="5">
                <div class="history-panel" data-history-panel="${item.id}" data-client-id="${item.client_id}" data-treatment-name="${encodeURIComponent(item.treatment_name)}" data-planned-sessions="${item.planned_sessions}" data-completed-sessions="${item.completed_sessions}" data-status="${item.status}">
                  <p class="form-note">Cargando historial...</p>
                </div>
              </td>
            </tr>
          `);
        });
      });

      tableBody.innerHTML = rows.join('');
    }

    async function loadSessions() {
      summary.textContent = 'Cargando...';
      try {
        const response = await fetch(`${API_URL}?${collectParams().toString()}`);
        if (!response.ok) throw new Error('No se pudieron obtener las sesiones.');
        const payload = await response.json();
        lastTotal = payload.total;
        renderRows(payload.items);

        const from = payload.total === 0 ? 0 : payload.offset + 1;
        const to = Math.min(payload.offset + payload.limit, payload.total);
        summary.textContent = `Mostrando ${from}-${to} de ${payload.total} sesiones.`;

        document.getElementById('prev').disabled = payload.offset <= 0;
        document.getElementById('next').disabled = payload.offset + payload.limit >= payload.total;
      } catch (error) {
        summary.textContent = error.message;
        tableBody.innerHTML = '';
      }
    }

    agendaList.addEventListener('click', async (event) => {
      const card = event.target.closest('.session-card');
      if (!card) return;
      const message = card.querySelector('[data-message]');
      const sessionId = card.dataset.sessionId;
      const appointmentId = card.dataset.appointmentId;

      const consentBtn = event.target.closest('[data-consent-appointment]');
      if (consentBtn) {
        const id = parseInt(consentBtn.dataset.consentAppointment, 10);
        const data = consentPrefillByAppointment[id];
        if (data) {
          openConsent(data, data.treatment, data.professional_name);
        }
        return;
      }

      if (event.target.closest('[data-attend]')) {
        const attended = event.target.closest('[data-attend]').dataset.attend === 'yes';
        message.textContent = 'Guardando...';
        try {
          const response = await fetch(ATTENDANCE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ appointment_id: parseInt(appointmentId, 10), attended: attended })
          });
          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.detail || 'No se pudo actualizar la asistencia.');
          }
          message.textContent = attended ? 'Asistencia marcada.' : 'No asistencia marcada.';
          loadAgenda();
          loadSessions();
        } catch (error) {
          message.textContent = error.message;
        }
        return;
      }

      if (event.target.closest('[data-save-session]')) {
        const completedInput = card.querySelector('[data-field=\"completed\"]');
        const notesInput = card.querySelector('[data-field=\"notes\"]');
        const completedValue = parseInt(completedInput.value, 10);
        message.textContent = 'Guardando detalles...';
        try {
          const response = await fetch(`${API_URL}/${sessionId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              completed_sessions: Number.isNaN(completedValue) ? 0 : completedValue,
              notes: notesInput.value || null
            })
          });
          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.detail || 'No se pudo guardar la sesion.');
          }
          message.textContent = 'Sesion actualizada.';
          loadAgenda();
          loadSessions();
        } catch (error) {
          message.textContent = error.message;
        }
      }
    });

    function buildHistoryHtml(sessionId, items, plannedSessions, completedSessions, statusValue) {
      const last = items[0];
      const lastDate = last ? last.appointment_date : '';
      const lastStart = last ? last.start_time : '10:00';
      const lastEnd = last ? last.end_time : '11:00';
      const lastProfessional = last ? last.professional_name : '';
      const bonusDefault = Number.isNaN(parseInt(plannedSessions, 10)) ? 4 : parseInt(plannedSessions, 10);
      const completedCount = Number.isNaN(parseInt(completedSessions, 10)) ? 0 : parseInt(completedSessions, 10);
      const plannedCount = Number.isNaN(parseInt(plannedSessions, 10)) ? 0 : parseInt(plannedSessions, 10);
      const isCompleted = statusValue === 'completed' || (plannedCount > 0 && completedCount >= plannedCount);
      const listHtml = items.length
        ? `
          <div class="history-list">
            ${items.map((item) => `
              <div class="history-item">
                <div>
                  <strong>${item.service_name}</strong>
                  <div class="history-meta">${item.appointment_date} · ${item.start_time} - ${item.end_time}</div>
                  ${item.notes ? `<div class="history-meta">${item.notes}</div>` : ''}
                </div>
                <div class="history-meta">${item.professional_name}</div>
                <div class="history-item-actions">
                  <div class="history-status">${item.status}</div>
                  <button class="btn btn-ghost btn-sm btn-danger" type="button" data-history-delete="${item.id}">Eliminar</button>
                </div>
              </div>
            `).join('')}
          </div>
        `
        : '<p class="form-note">Sin citas historicas para esta sesion.</p>';

      const bonusHtml = isCompleted
        ? `
        <div class="bonus-form" data-bonus-form="${sessionId}">
          <label>Nuevo bono</label>
          <input type="number" min="1" value="${bonusDefault}" name="bonus_sessions" />
          <button class="btn btn-ghost btn-sm" type="button" data-bonus-create="${sessionId}">Crear bono</button>
          <span class="form-note" data-bonus-message></span>
        </div>
        `
        : '';

      return `
        <div class="history-toolbar">
          <button class="btn btn-ghost btn-sm" type="button" data-history-add="${sessionId}">Agregar sesion pasada</button>
          <span class="form-note">Se guarda como completada.</span>
        </div>
        ${bonusHtml}
        <form class="history-form" data-history-form="${sessionId}" data-last-date="${lastDate}" data-last-start="${lastStart}" data-last-end="${lastEnd}" data-last-professional="${lastProfessional}" hidden>
          <div>
            <label>Fecha</label>
            <input type="date" name="appointment_date" required />
          </div>
          <div>
            <label>Hora inicio</label>
            <input type="time" name="start_time" required />
          </div>
          <div>
            <label>Hora fin</label>
            <input type="time" name="end_time" required />
          </div>
          <div>
            <label>Profesional</label>
            <input type="text" name="professional_name" required />
          </div>
          <div class="form-grid-1">
            <label>Notas</label>
            <input type="text" name="notes" />
          </div>
          <div class="session-actions form-grid-1">
            <button class="btn btn-ghost btn-sm" type="button" data-history-duplicate="${sessionId}">Duplicar ultima</button>
            <button class="btn btn-sm" type="submit">Guardar sesion</button>
            <button class="btn btn-ghost btn-sm" type="button" data-history-cancel="${sessionId}">Cancelar</button>
          </div>
          <p class="session-message" data-history-message></p>
        </form>
        ${listHtml}
      `;
    }

    function fillHistoryForm(form, values) {
      form.querySelector('[name="appointment_date"]').value = values.date || '';
      form.querySelector('[name="start_time"]').value = values.start || '10:00';
      form.querySelector('[name="end_time"]').value = values.end || '11:00';
      form.querySelector('[name="professional_name"]').value = values.professional || '';
      form.querySelector('[name="notes"]').value = values.notes || '';
    }

    async function loadHistory(sessionId, panel) {
      panel.innerHTML = '<p class="form-note">Cargando historial...</p>';
      const response = await fetch(`${window.APP_CONFIG.API_BASE_URL}/admin/sessions/${sessionId}/appointments?limit=50&offset=0`);
      if (!response.ok) throw new Error('No se pudo cargar el historial.');
      const payload = await response.json();
      const plannedSessions = panel.dataset.plannedSessions || '4';
      const completedSessions = panel.dataset.completedSessions || '0';
      const statusValue = panel.dataset.status || '';
      const html = buildHistoryHtml(sessionId, payload.items || [], plannedSessions, completedSessions, statusValue);
      panel.innerHTML = html;
      historyCache[sessionId] = html;
    }

    tableBody.addEventListener('click', async (event) => {
      const consentBtn = event.target.closest('[data-consent-session]');
      if (consentBtn) {
        const id = parseInt(consentBtn.dataset.consentSession, 10);
        const data = consentPrefillBySession[id];
        if (data) {
          openConsent(data, data.treatment, data.professional_name);
        }
        return;
      }
      const deleteBtn = event.target.closest('[data-session-delete]');
      if (deleteBtn) {
        const sessionId = deleteBtn.dataset.sessionDelete;
        if (!confirm('Eliminar esta sesion?')) return;
        try {
          const response = await fetch(`${window.APP_CONFIG.API_BASE_URL}/admin/sessions/${sessionId}`, {
            method: 'DELETE'
          });
          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.detail || 'No se pudo eliminar la sesion.');
          }
          loadSessions();
        } catch (error) {
          alert(error.message);
        }
        return;
      }

      const addButton = event.target.closest('[data-history-add]');
      if (addButton) {
        const sessionId = addButton.dataset.historyAdd;
        const form = tableBody.querySelector(`[data-history-form="${sessionId}"]`);
        if (!form) return;
        const today = new Date().toISOString().slice(0, 10);
        fillHistoryForm(form, {
          date: form.dataset.lastDate || today,
          start: form.dataset.lastStart || '10:00',
          end: form.dataset.lastEnd || '11:00',
          professional: form.dataset.lastProfessional || '',
        });
        form.removeAttribute('hidden');
        return;
      }

      const cancelButton = event.target.closest('[data-history-cancel]');
      if (cancelButton) {
        const sessionId = cancelButton.dataset.historyCancel;
        const form = tableBody.querySelector(`[data-history-form="${sessionId}"]`);
        if (form) {
          form.setAttribute('hidden', '');
        }
        return;
      }

      const duplicateButton = event.target.closest('[data-history-duplicate]');
      if (duplicateButton) {
        const sessionId = duplicateButton.dataset.historyDuplicate;
        const form = tableBody.querySelector(`[data-history-form="${sessionId}"]`);
        if (!form) return;
        fillHistoryForm(form, {
          date: form.dataset.lastDate || '',
          start: form.dataset.lastStart || '10:00',
          end: form.dataset.lastEnd || '11:00',
          professional: form.dataset.lastProfessional || '',
        });
        form.removeAttribute('hidden');
        return;
      }

      const historyDelete = event.target.closest('[data-history-delete]');
      if (historyDelete) {
        const appointmentId = historyDelete.dataset.historyDelete;
        const panel = historyDelete.closest('[data-history-panel]');
        const sessionId = panel ? panel.dataset.historyPanel : null;
        if (!confirm('Eliminar esta sesion historica?')) return;
        try {
          const response = await fetch(`${window.APP_CONFIG.API_BASE_URL}/appointments/${appointmentId}`, {
            method: 'DELETE'
          });
          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.detail || 'No se pudo eliminar la sesion.');
          }
          if (sessionId) {
            historyCache[sessionId] = '';
            const activePanel = tableBody.querySelector(`[data-history-panel="${sessionId}"]`);
            if (activePanel) {
              await loadHistory(sessionId, activePanel);
            }
          }
          loadSessions();
        } catch (error) {
          alert(error.message);
        }
        return;
      }

      const bonusButton = event.target.closest('[data-bonus-create]');
      if (bonusButton) {
        const sessionId = bonusButton.dataset.bonusCreate;
        const panel = tableBody.querySelector(`[data-history-panel="${sessionId}"]`);
        if (!panel) return;
        const form = panel.querySelector('[data-bonus-form]');
        const message = panel.querySelector('[data-bonus-message]');
        const sessionsInput = form.querySelector('[name="bonus_sessions"]');
        const planned = parseInt(sessionsInput.value, 10);
        const clientId = parseInt(panel.dataset.clientId, 10);
        const treatmentName = decodeURIComponent(panel.dataset.treatmentName || '');
        if (!clientId || !treatmentName || Number.isNaN(planned) || planned < 1) {
          message.textContent = 'Completa las sesiones del bono.';
          return;
        }
        message.textContent = 'Creando bono...';
        try {
          const response = await fetch(`${window.APP_CONFIG.API_BASE_URL}/sessions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              client_id: clientId,
              treatment_name: treatmentName,
              planned_sessions: planned,
              completed_sessions: 0,
              status: 'planned',
              notes: null
            })
          });
          if (!response.ok) {
            const data = await response.json();
            throw new Error(data.detail || 'No se pudo crear el bono.');
          }
          message.textContent = 'Bono creado.';
          loadSessions();
        } catch (error) {
          message.textContent = error.message;
        }
        return;
      }

      const toggle = event.target.closest('[data-history-toggle]');
      if (!toggle) return;
      const sessionId = toggle.dataset.historyToggle;
      const row = tableBody.querySelector(`[data-history-row="${sessionId}"]`);
      const panel = tableBody.querySelector(`[data-history-panel="${sessionId}"]`);
      if (!row || !panel) return;

      const isHidden = row.hasAttribute('hidden');
      if (!isHidden) {
        row.setAttribute('hidden', '');
        toggle.textContent = 'Ver historial';
        return;
      }

      row.removeAttribute('hidden');
      toggle.textContent = 'Ocultar historial';

      if (historyCache[sessionId]) {
        panel.innerHTML = historyCache[sessionId];
        return;
      }

      try {
        await loadHistory(sessionId, panel);
      } catch (error) {
        panel.innerHTML = `<p class="form-note">${error.message}</p>`;
      }
    });

    tableBody.addEventListener('submit', async (event) => {
      const form = event.target.closest('[data-history-form]');
      if (!form) return;
      event.preventDefault();
      const sessionId = form.dataset.historyForm;
      const message = form.querySelector('[data-history-message]');
      const payload = {
        appointment_date: form.querySelector('[name="appointment_date"]').value,
        start_time: form.querySelector('[name="start_time"]').value,
        end_time: form.querySelector('[name="end_time"]').value,
        professional_name: form.querySelector('[name="professional_name"]').value,
        notes: form.querySelector('[name="notes"]').value || null,
        status: 'completed'
      };
      message.textContent = 'Guardando...';
      try {
        const response = await fetch(`${window.APP_CONFIG.API_BASE_URL}/admin/sessions/${sessionId}/appointments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || 'No se pudo guardar la sesion.');
        }
        message.textContent = 'Sesion guardada.';
        historyCache[sessionId] = '';
        const panel = tableBody.querySelector(`[data-history-panel="${sessionId}"]`);
        if (panel) {
          await loadHistory(sessionId, panel);
        }
        loadSessions();
      } catch (error) {
        message.textContent = error.message;
      }
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      offset = 0;
      loadSessions();
    });

    document.getElementById('reset').addEventListener('click', () => {
      form.reset();
      offset = 0;
      loadSessions();
    });

    document.getElementById('prev').addEventListener('click', () => {
      offset = Math.max(0, offset - limit);
      loadSessions();
    });

    document.getElementById('next').addEventListener('click', () => {
      if (offset + limit < lastTotal) {
        offset += limit;
        loadSessions();
      }
    });

    agendaDate.valueAsDate = new Date();
    agendaRefresh.addEventListener('click', loadAgenda);
    agendaDate.addEventListener('change', loadAgenda);
    if (agendaProfessional) {
      agendaProfessional.addEventListener('change', loadAgenda);
    }

    if (window.LikeStudioWidgets && clientQueryInput) {
      window.LikeStudioWidgets.attachClientAutocomplete(clientQueryInput, { minChars: 2 });
    }

    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('query');
    if (initialQuery && clientQueryInput) {
      clientQueryInput.value = initialQuery;
    }

    loadSessions();
    loadAgenda();
  </script>
</body>
</html>
