<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videos | Like Studio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/site.css" />
  <link rel="stylesheet" href="../css/admin-common.css" />
  <link rel="stylesheet" href="../css/menu-component.css" />
  <link rel="stylesheet" href="../css/admin-training.css" />
</head>
<body>
  <!-- Menu will be automatically rendered here by the component -->
  <header class="topbar"></header>

  <main class="admin-page-main">
    <p class="page-eyebrow">Academia</p>
    <h1 class="page-title">Gestión de Videos</h1>

    <div class="section-header">
      <h2>Biblioteca de Videos</h2>
      <button class="btn btn-primary" id="upload-video-btn">+ Subir Video</button>
    </div>

    <div id="videos-grid" class="videos-grid"></div>

    <!-- Upload Section (initially hidden) -->
    <div id="upload-section" style="display:none; margin-top: 2rem;">
      <h3>Subir Video a S3</h3>
      <div class="upload-zone" id="upload-zone">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--accent);margin-bottom:1rem">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Arrastra tu video aquí o haz clic para seleccionar</p>
        <p class="text-sm text-muted">MP4, MOV, AVI — máx. recomendado 2 GB</p>
        <input type="file" id="video-upload" accept="video/*" style="display:none">
      </div>
      <div class="upload-progress" id="upload-progress" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="progress-bar-fill"></div></div>
        <span id="progress-text">0%</span>
      </div>
    </div>
  </main>

  <!-- Modal: Metadatos del Video -->
  <div id="video-meta-modal" class="modal" onclick="if(event.target===this)closeModal('video-meta-modal')">
    <div class="modal-content">
      <h3>Datos del Video</h3>
      <form id="video-meta-form">
        <input type="hidden" id="vmeta-filename">
        <input type="hidden" id="vmeta-s3key">
        <input type="hidden" id="vmeta-s3bucket">
        <input type="hidden" id="vmeta-filesize">
        <input type="hidden" id="vmeta-mimetype">
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="vmeta-title" required>
        </div>
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="vmeta-description" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>Duración (segundos) — opcional</label>
          <input type="number" id="vmeta-duration" min="0">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('video-meta-modal')">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Video</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../static/js/app-config.js"></script>
  <script src="../static/js/admin-auth.js"></script>
  <script src="../static/js/admin-api.js"></script>
  <script src="../static/js/admin-widgets.js"></script>
  <script src="../static/js/site.js"></script>
  <script src="../static/js/menu-component.js"></script>
  <script type="module" src="js/videos.js" defer></script>
</body>
</html>
