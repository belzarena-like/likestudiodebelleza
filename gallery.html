<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeria | Like Studio Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css" />
  <style>
    .gallery-wrap { width: min(1200px, 100% - 2rem); margin: 2rem auto 4rem; }
    .gallery-filter { display: flex; gap: 10px; flex-wrap: wrap; margin: 1rem 0 1.5rem; }
    .gallery-filter button { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: #141922; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
    .gallery-filter button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    .gallery-masonry { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .gallery-masonry img { width: 100%; height: 280px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); cursor: zoom-in; box-shadow: var(--shadow); }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.86); display: none; place-items: center; z-index: 99; padding: 2rem; }
    .lightbox.active { display: grid; }
    .lightbox img { max-width: min(1000px, 100%); max-height: 85vh; border-radius: 12px; }
    .lightbox button { position: absolute; top: 20px; right: 20px; border: 0; border-radius: 999px; width: 42px; height: 42px; background: #fff; font-size: 22px; cursor: pointer; }
    @media (max-width: 900px) { .gallery-masonry { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .gallery-masonry { grid-template-columns: 1fr; } .gallery-masonry img { height: 230px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="assets/imgs/logo.png" alt="Like Studio logo" />
      <span>Like Studio Academy</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Abrir menu" data-menu-toggle>Menu</button>
    <nav class="menu" data-menu>
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <a href="reserva.html">Reserva online</a>
      <a href="gallery.html">Galeria</a>
      <a href="index.html#instagram">Instagram</a>
      <a href="index.html#academy">Academia</a>
      <a href="index.html#contact">Contacto</a>
      <a class="btn btn-sm" href="https://api.whatsapp.com/send?phone=34603749744&text=Hola,%20quiero%20reservar%20una%20cita" target="_blank" rel="noreferrer">WhatsApp</a>
    </nav>
  </header>

  <main class="gallery-wrap">
    <p class="eyebrow">Galeria</p>
    <h1>Trabajos reales</h1>
    <div class="gallery-filter" id="galleryFilter"></div>
    <div class="gallery-masonry" id="galleryGrid"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <button id="lightboxClose" aria-label="Cerrar">&times;</button>
    <img id="lightboxImg" alt="Trabajo ampliado" />
  </div>

  <script>
    const images = [

      ...Array.from({ length: 13 }, (_, i) => `assets/imgs/cejasFemininas/cejas_femininas (${i + 1}).jpeg`),
      ...Array.from({ length: 4 }, (_, i) => `assets/imgs/cejasMasculinas/cejas_masculinas (${i + 1}).jpeg`),
      ...Array.from({ length: 8 }, (_, i) => `assets/imgs/microCapilar/micro_capilar (${i + 1}).jpeg`),
    
    ];

    const items = images.map((src) => {
      let c = 'General';
      if (src.includes('/cejasFemininas/')) c = 'Cejas Femeninas';
      else if (src.includes('/cejasMasculinas/')) c = 'Cejas Masculinas';
      else if (src.includes('/microCapilar/')) c = 'Micro Capilar';
      else if (src.includes('/servicios/')) c = 'Micropigmentacion';
      return { c, src };
    });

    const categories = ['Todos', ...new Set(items.map((i) => i.c))];
    const params = new URLSearchParams(window.location.search);
    const initialCat = categories.includes(params.get('cat')) ? params.get('cat') : 'Todos';

    const filter = document.getElementById('galleryFilter');
    const grid = document.getElementById('galleryGrid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function renderButtons(active) {
      filter.innerHTML = categories
        .map((c) => `<button class="${c === active ? 'active' : ''}" data-cat="${c}">${c}</button>`)
        .join('');
    }

    function renderGrid(active) {
      const filtered = active === 'Todos' ? items : items.filter((i) => i.c === active);
      grid.innerHTML = filtered.map((i) => `<img src="${i.src}" alt="${i.c}" loading="lazy" />`).join('');
    }

    renderButtons(initialCat);
    renderGrid(initialCat);

    filter.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-cat]');
      if (!btn) return;
      const cat = btn.dataset.cat;
      renderButtons(cat);
      renderGrid(cat);
      const url = new URL(window.location.href);
      if (cat === 'Todos') url.searchParams.delete('cat');
      else url.searchParams.set('cat', cat);
      history.replaceState({}, '', url);
    });

    grid.addEventListener('click', (e) => {
      const img = e.target.closest('img');
      if (!img) return;
      lightboxImg.src = img.src;
      lightbox.classList.add('active');
    });

    document.getElementById('lightboxClose').addEventListener('click', () => lightbox.classList.remove('active'));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('active'); });
  </script>
  <script src="static/js/site.js"></script>
</body>
</html>
