<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - LikeByLi</title>
    <style>
        :root {
            --primary: #ff214f;
            --secondary: #d4002c;
            --dark: #343a40;
            --light: #f8f9fa;
            --accent: #ff5477;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: var(--light);
            padding: 2rem 0;
            min-height: 100vh;
        }

        .gallery-section {
            max-width: 1400px;
            margin: 0 auto 4rem;
            padding: 0 1rem;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        .gallery-section:nth-child(2) {
            animation-delay: 0.2s;
        }

        .gallery-section:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .section-header h2 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .section-header::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            margin: 1rem auto;
            border-radius: 2px;
        }

        .carousel-container {
            position: relative;
            overflow: hidden;
            padding: 0 60px;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
            gap: 1.5rem;
        }

        .carousel-item {
            flex: 0 0 calc(25% - 1.125rem);
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 1;
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 163, 115, 0.2);
        }

        .carousel-item:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 33, 79, 0.3);
            border-color: var(--primary);
            z-index: 10;
        }

        .carousel-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease, filter 0.4s ease;
        }

        .carousel-item:hover .carousel-img {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .carousel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 33, 79, 0.9), rgba(212, 0, 44, 0.9));
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .carousel-item:hover .carousel-overlay {
            opacity: 1;
        }

        .carousel-icon {
            width: 60px;
            height: 60px;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            transform: scale(0.8) rotate(-90deg);
            transition: transform 0.4s ease;
        }

        .carousel-item:hover .carousel-icon {
            transform: scale(1) rotate(0deg);
        }

        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .carousel-nav:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 5px 20px rgba(255, 33, 79, 0.6);
        }

        .carousel-prev {
            left: 0;
        }

        .carousel-next {
            right: 0;
        }

        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 30px;
            border-radius: 5px;
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(255, 33, 79, 0.5);
            animation: scaleIn 0.4s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 5px 20px rgba(255, 33, 79, 0.6);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 33, 79, 0.8);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-nav:hover {
            background: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-prev {
            left: 2rem;
        }

        .lightbox-next {
            right: 2rem;
        }

        @media (max-width: 1024px) {
            .carousel-item {
                flex: 0 0 calc(33.333% - 1rem);
            }
        }

        @media (max-width: 768px) {
            .section-header h2 {
                font-size: 2rem;
            }

            .carousel-container {
                padding: 0 50px;
            }

            .carousel-item {
                flex: 0 0 calc(50% - 0.75rem);
            }

            .carousel-nav {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .lightbox-nav,
            .lightbox-close {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .lightbox-prev {
                left: 1rem;
            }

            .lightbox-next {
                right: 1rem;
            }
        }

        @media (max-width: 480px) {
            .carousel-item {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
<body>
    <div id="galleriesContainer"></div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">×</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
        <img class="lightbox-content" id="lightboxImg" alt="Gallery Image">
        <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
    </div>

<script src="assets/js/gallery.js"></script>
</body>
</html>
